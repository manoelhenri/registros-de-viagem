<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D6246A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quem é mais?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>window.__PWA=true;</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Quem é Mais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: app de uma tela por vez. Barra no topo (menu, título, atalho), conteúdo no meio e botões de ação fixos na base, na zona do polegar. Cada casal tem uma cor própria usada em avatares, pontos e bordas, nunca em texto. Rosa é a marca; verde e vermelho só indicam sintonia e divergência. */
:root{
  --bg:#F5F2FC;
  --surface:#FFFFFF;
  --soft:#ECE8F9;
  --ink:#1D1838;
  --muted:#5F5985;
  --line:#DCD7F0;
  --accent:#D6246A;
  --on-accent:#FFFFFF;
  --gold:#F2B705;
  --good:#12775A;
  --on-good:#FFFFFF;
  --bad:#C62828;
  --on-bad:#FFFFFF;
  --c1:#2F5FD0;  --on-c1:#FFFFFF;
  --c2:#F0A202;  --on-c2:#2A1B00;
  --c3:#8B3FD0;  --on-c3:#FFFFFF;
  --c4:#0E8FA3;  --on-c4:#FFFFFF;
  --c5:#7FA00C;  --on-c5:#1C2400;
  --c6:#5D6C80;  --on-c6:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13102A;
    --surface:#1D1940;
    --soft:#2A2559;
    --ink:#F2EFFF;
    --muted:#A9A3D2;
    --line:#352F66;
    --accent:#FF5C93;
    --on-accent:#1A0A14;
    --gold:#FFD25A;
    --good:#4BDDA6;
    --on-good:#06281C;
    --bad:#FF7A7A;
    --on-bad:#2A0A0A;
    --c1:#7FA2FF;  --on-c1:#0E1A44;
    --c2:#FFC53D;  --on-c2:#2A1B00;
    --c3:#C79BFF;  --on-c3:#230B3D;
    --c4:#5CD6EA;  --on-c4:#052A33;
    --c5:#C4E65C;  --on-c5:#1C2400;
    --c6:#AEBBCD;  --on-c6:#14202E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13102A;
  --surface:#1D1940;
  --soft:#2A2559;
  --ink:#F2EFFF;
  --muted:#A9A3D2;
  --line:#352F66;
  --accent:#FF5C93;
  --on-accent:#1A0A14;
  --gold:#FFD25A;
  --good:#4BDDA6;
  --on-good:#06281C;
  --bad:#FF7A7A;
  --on-bad:#2A0A0A;
  --c1:#7FA2FF;  --on-c1:#0E1A44;
  --c2:#FFC53D;  --on-c2:#2A1B00;
  --c3:#C79BFF;  --on-c3:#230B3D;
  --c4:#5CD6EA;  --on-c4:#052A33;
  --c5:#C4E65C;  --on-c5:#1C2400;
  --c6:#AEBBCD;  --on-c6:#14202E;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(60% 32% at 100% 0%, color-mix(in srgb,var(--accent) 16%, transparent), transparent),
    radial-gradient(55% 30% at 0% 18%, color-mix(in srgb,var(--c3) 14%, transparent), transparent);
  background-repeat:no-repeat;
  color:var(--ink);
  font:16px/1.5 var(--body);
  padding-inline:16px;
  padding-block:0 40px;
}
body.hasdock{padding-block-end:132px}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.ic.fill{fill:currentColor}
.ic.lg{width:28px;height:28px}

.app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.app.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.view{display:flex;flex-direction:column;gap:16px}
.view.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* barra do app */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:8px 16px 10px;margin-inline:-16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.appbar .ttl{text-align:center;font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .pb{position:absolute;left:16px;right:16px;bottom:3px;height:3px;border-radius:99px;background:var(--soft);overflow:hidden}
.appbar .pb i{display:block;height:100%;background:var(--accent);transition:width .3s}
.brand{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .ic{color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
.link{background:none;border:0;padding:8px 4px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}

/* KV */
.kv{display:flex;flex-direction:column;gap:14px}
.stage{border-radius:28px;border:1px solid var(--line);background-color:var(--surface);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1.2px,transparent 1.6px);background-size:14px 14px;padding:14px 10px 6px;overflow:hidden}
.art{display:block;width:100%;height:auto;max-height:230px}
.art .bt{font-family:var(--display);font-weight:800}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.sticker{display:inline-flex;align-items:center;gap:6px;transform:rotate(-3deg);background:var(--gold);color:#1D1838;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;align-self:flex-start}
.kvtext{display:flex;flex-direction:column;gap:10px;padding-top:2px}
.kvtext h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,72px);line-height:.92;letter-spacing:-.035em;text-wrap:balance}
.hl{background:linear-gradient(transparent 64%,color-mix(in srgb,var(--accent) 50%,transparent) 64%);padding-inline:2px}
.lede{color:var(--muted);max-width:46ch}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:8px;width:max-content;animation:slide 40s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.tag{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.tag .ic{color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts .ic{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .opt,.card .nameinput,.card .switchrow{background:var(--bg)}
.section{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.center{text-align:center}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.03em}
.resume b{font-family:var(--display);font-weight:800;font-size:22px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.couple{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.couple legend{padding:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cc);flex:none}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.amp{color:var(--accent)}
.nameinput{width:100%;min-width:0;padding:13px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:500}
.nameinput:focus{border-color:var(--cc);outline:none}
.nameinput:focus-visible{outline:3px solid var(--cc);outline-offset:1px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:500;min-height:44px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.opt.num{min-width:48px;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.switchrow b{display:block;font-weight:700}
.switchrow span{font-size:13px;color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(22px)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:none;min-height:56px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-family:var(--body);font-weight:700;font-size:16px;padding:12px 16px}
.btn.danger{background:var(--bad);color:var(--on-bad)}

/* base fixa */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dockin{max-width:560px;margin-inline:auto;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dockin .btn{flex:1;min-width:0}
.dockin .btn.ghost{flex:0 0 auto;width:auto}

/* placar */
.scores{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px}
.score{flex:1 0 104px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.score .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.score .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.score .n.bump{animation:bump .6s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--accent)}100%{transform:scale(1)}}
.score .t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.score .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .dot{width:9px;height:9px}
.fl{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;font-size:12px}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.1px,transparent 1.5px);background-size:14px 14px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pill .ic{color:var(--accent)}
.badge2{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1D1838;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;animation:pulse 1.4s ease-in-out infinite}
.qcard h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.5vw,44px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}

.count{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;text-align:center}
.count .num{font-family:var(--display);font-weight:800;font-size:150px;line-height:1;color:var(--accent);animation:pop .9s ease-out both;font-variant-numeric:tabular-nums}
.count .go{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,68px);line-height:1;color:var(--accent);animation:pop 1.1s ease-out both}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

.markcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.markcard.done{border-color:var(--cc)}
.mhead{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.mhead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.mopt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 10px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-weight:700;min-width:0}
.mopt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopt .av{width:24px;height:24px;border-radius:50%;background:var(--cc);color:var(--onc);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;font-style:normal}
.mopt[aria-pressed="true"]{background:var(--cc);color:var(--onc);border-color:var(--cc)}
.mopt[aria-pressed="true"] .av{background:var(--onc);color:var(--cc)}
.mopt.x[aria-pressed="true"]{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}

.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rcard.anim{animation:flip .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * var(--step,.65s))}
@keyframes flip{0%{opacity:0;transform:perspective(600px) rotateX(-70deg) translateY(14px)}100%{opacity:1;transform:none}}
.rhead{display:flex;align-items:center;gap:10px}
.stat{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.rcard.match .stat{background:var(--good);color:var(--on-good)}
.rcard.conflict .stat{background:var(--bad);color:var(--on-bad)}
.rtitle{min-width:0;flex:1}
.rtitle b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle span{font-size:14px;color:var(--muted)}
.pts{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;color:var(--good)}
.combo{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 9px}
.pren{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pmeta .k{display:inline-flex;align-items:center;gap:5px}
.pmeta .lvl{display:inline-flex;color:var(--accent)}
.ptext{font-weight:500;font-size:17px;line-height:1.4}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;min-height:40px}
.mini[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on-good)}

/* fim */
.podium{display:grid;gap:8px;align-items:end;padding-top:6px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pcol .crown{color:var(--gold)}
.pcol .nm{font-weight:700;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.pcol .pt{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.block{width:100%;border-radius:14px 14px 0 0;background:var(--cc);color:var(--onc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px}
.awards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.award .ic{color:var(--accent);width:24px;height:24px}
.award b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.award span{font-size:13px;color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .nm{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.trow .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .v{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;grid-row:span 2}
.trow small{color:var(--muted);font-size:13px}
.trow .bar{grid-column:1/-1;height:6px}
.trow .bar i{background:var(--cc)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.shbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shbtns .full{grid-column:1/-1}
.sharecard{width:100%;height:auto;border-radius:18px;border:1px solid var(--line);display:block}
.sharetxt{width:100%;min-height:170px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:12px;resize:vertical;line-height:1.45;margin-top:10px}
details.recap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
details.recap summary{cursor:pointer;font-weight:700}
details.recap ol{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
details.recap li b{font-weight:500}
.rrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rr{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--bg);border-radius:999px;padding:4px 10px}
.rr.ok .ic{color:var(--good)}
.rr.no .ic{color:var(--bad)}

/* folhas e diálogos */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgb(12 8 32 / .55);z-index:60;cursor:pointer}
.scrim.top{z-index:70}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin-inline:auto;max-height:calc(100% - 24px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet.anim{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shead b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);min-height:56px}
.mitem .bub{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none}
.mitem .tx{min-width:0;flex:1}
.mitem .tx b{display:block;font-weight:700}
.mitem .tx span{font-size:13px;color:var(--muted)}
.mitem .go{color:var(--muted)}
.mitem.warn .bub{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.step .bub{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none}
.step b{display:block}
.step span{font-size:14px;color:var(--muted)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
.dialog{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin-inline:auto;z-index:71;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog.anim{animation:dpop .2s ease-out}
@keyframes dpop{from{opacity:0;transform:translateY(-46%) scale(.96)}to{opacity:1;transform:translateY(-50%)}}
.dialog h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.dialog p{color:var(--muted)}
.dialog .row{display:flex;gap:10px}
.dialog .row .btn{padding:12px 14px;min-height:50px;font-size:16px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:80;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .track{animation:none;flex-wrap:wrap;width:auto}
  .pulse,.badge2,.count .num,.count .go,.rcard.anim,.app.shake,.score .n.bump,.view.enter,.sheet.anim,.dialog.anim{animation:none}
  .appbar .pb i,.switch,.switch::after,#toast{transition:none}
}
</style>

let actx=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
  return actx;
}
function tone(freq,t0,dur,type,vol,slideTo){
  if(!S.sound) return;
  const a=ac();if(!a) return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||.1,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}

const cv=document.getElementById('fx'),cx=cv.getContext?cv.getContext('2d'):null;
let parts=[],raf=0;
function sizeCv(){
  if(!cx) return;
  const d=window.devicePixelRatio||1;
  cv.width=Math.round(window.innerWidth*d);cv.height=Math.round(window.innerHeight*d);
  cx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',sizeCv);sizeCv();
function confetti(n){
  if(reduce||!cx) return;
  const cols=[css('--c1'),css('--c2'),css('--c3'),css('--accent'),'#F2B705'];
  const W=window.innerWidth,H=window.innerHeight;
  for(let i=0;i<n;i++){
    parts.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.4,vx:(Math.random()-.5)*10,vy:-Math.random()*12-3,g:.3,s:6+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  }
  if(!raf) loop();
}
function loop(){
  const W=window.innerWidth,H=window.innerHeight;
  cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.y<H+30);
  parts.forEach(p=>{
    p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();
  });
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf) cx.clearRect(0,0,W,H);
}
function shake(){
  if(reduce) return;
  app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');
  at(()=>app.classList.remove('shake'),600);
}

function prendaBlock(r){
  if(!r.prenda) return '<p class="hint">Sem prendas nesta partida. Fica só sem o ponto.</p>';
  const p=r.prenda,t=TAGS[p.tag];
  const fl=Array.from({length:p.l}).map(()=>ic('flame','fill')).join('');
  return '<div class="pren"><div class="pmeta"><span class="k">'+ic(t.i)+t.n+'</span><span class="lvl" aria-label="Nível '+p.l+' de 3">'+fl+'</span></div>'+
    '<p class="ptext">'+esc(p.t)+'</p><div class="pact">'+
    '<button type="button" class="mini" data-act="swappr" data-c="'+r.c+'">'+ic('swap')+'Trocar prenda</button>'+
    '<button type="button" class="mini" data-act="done" data-c="'+r.c+'" aria-pressed="'+r.done+'">'+ic('check')+'Cumprida</button></div></div>';

function viewReveal(){

      return '<div class="'+cls+'" style="--k:'+k+';--step:'+step+'"><div class="rhead"><span class="stat">'+ic('check')+'</span>'+
        '<div class="rtitle"><b>'+esc(cname(r.c))+'</b><span>Apontaram para '+esc(nm(r.who))+'. '+esc(r.quip)+'</span></div>'+
        '<span class="pts">+'+r.pts+'</span></div>'+

      '<div class="rtitle"><b>'+esc(cname(r.c))+'</b><span>Divergiram! '+esc(r.quip)+'</span></div></div>'+prendaBlock(r)+'</div>';
  }).join('');
  return '<div class="rlist">'+cards+'</div>';
}

function viewPlay(){
  const q=S.qs[S.i],cat=catById[q.cat];
  const head=scoresRow()+
    '<section class="qcard"><div class="qtop"><span class="pill">'+ic(cat.icon)+esc(cat.name)+'</span>'+
    (q.double?'<span class="badge2">'+ic('bolt','fill')+'Vale em dobro</span>':'')+'</div><h2>'+esc(q.t)+'</h2></section>';
  let body='';
  if(S.phase==='ask'){
    body='<p class="hint center">Cada casal pensa em silêncio. Quando chegar no zero, os dois apontam ao mesmo tempo, um para o outro ou para si.</p>';
  }else if(S.phase==='count'){
    body='<div class="count" role="status" aria-live="assertive">'+(S.count>0?'<div class="num">'+S.count+'</div>':'<div class="go">Apontem!</div>')+
      '<p class="hint">Cada casal aponta entre si.</p></div>';

function awards(){
  const out=[];
  const mt=topOf(S.matches);if(mt.m>0) out.push({i:'heart',t:'Casal mais afinado',v:mt.idx.map(cname).join(' e '),s:mt.m+' '+plural(mt.m,'sintonia','sintonias')});
  const ct=topOf(S.conflicts);if(ct.m>0) out.push({i:'bolt',t:'Casal mais caótico',v:ct.idx.map(cname).join(' e '),s:ct.m+' '+plural(ct.m,'divergência','divergências')});
  const pt=topOf(S.cited);if(pt.m>0) out.push({i:'star',t:'Mais citado(a) da noite',v:pt.idx.map(nm).join(' e '),s:'Apontado(a) '+pt.m+' '+plural(pt.m,'vez','vezes')});
  const bt=topOf(S.best);if(bt.m>=2) out.push({i:'flame',t:'Maior sequência',v:bt.idx.map(cname).join(' e '),s:bt.m+' sintonias seguidas'});
  if(S.prTotal>0) out.push({i:'check',t:'Prendas cumpridas',v:S.prDone+' de '+S.prTotal,s:'Marcadas como cumpridas'});
  return out;
}
function shareText(){

      ?'<button type="button" class="btn ghost" data-act="setup">Novo jogo</button><button type="button" class="btn" data-act="continue">'+ic('play','fill')+'Continuar</button>'

function rr(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function fit(g,text,maxW,size,weight,fam){
  let s=size;
  do{g.font=weight+' '+s+'px '+fam;s-=2;}while(g.measureText(text).width>maxW&&s>14);
}

    ['MAIS AFINADO',mt.m>0?mt.idx.map(cname).join(' e '):'-'],
    ['MAIS CAÓTICO',ct.m>0?ct.idx.map(cname).join(' e '):'-'],
    ['MAIS CITADO(A)',pt.m>0?pt.idx.map(nm).join(' e '):'-']
  ];
  boxes.forEach((b,i)=>{
    const x=72+i*320,y=1010;
    g.fillStyle=sf;rr(g,x,y,296,200,24);g.fill();g.strokeStyle=ln;g.lineWidth=2;g.stroke();
    g.fillStyle=mu;g.font='700 22px '+B;try{g.letterSpacing='3px';}catch(e){}
    g.fillText(b[0],x+24,y+44);
    try{g.letterSpacing='0px';}catch(e){}
    g.fillStyle=ink;fit(g,b[1],248,38,800,D);
    if(g.measureText(b[1]).width<=248){g.fillText(b[1],x+24,y+110);}
    else{
      g.font='800 28px '+D;
      let l1='',l2='';
      b[1].split(' ').forEach(w=>{if(!l2&&g.measureText((l1+' '+w).trim()).width<=248) l1=(l1+' '+w).trim(); else l2=(l2+' '+w).trim();});
      g.fillText(l1,x+24,y+104);g.fillText(l2,x+24,y+140);
    }
  });
  g.fillStyle=mu;g.font='500 26px '+B;g.textAlign='center';
  g.fillText('Quem é mais? · jogo de casais',W/2,1290);
  return c.toDataURL('image/png');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){
    try{
      const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;
    }catch(err){return false;}
  }
}

/* ============ lógica do jogo ============ */
function startGame(){
  clearTimers();
  const nc=S.nc;
  S.gn=S.names.map((v,i)=>(String(v||'').trim()||DEFAULT_NAMES[i]));
  S.glevel=S.level;
  const list=shuffle(poolQ());
  const n=S.rounds>0?Math.min(S.rounds,list.length):list.length;
  S.qs=list.slice(0,n).map(q=>({cat:q.cat,t:q.t,double:false}));
  S.spares=list.slice(n);
  if(S.doubles&&n>1){
    shuffle(Array.from({length:n-1},(_,k)=>k+1)).slice(0,Math.max(1,Math.round(n/5))).forEach(k=>{S.qs[k].double=true;});
  }
  S.i=0;S.phase='ask';S.marks=Array.from({length:nc},()=>null);S.current=null;S.snap=null;
  S.pts=zeros(nc);S.shown=zeros(nc);S.matches=zeros(nc);S.conflicts=zeros(nc);S.streak=zeros(nc);S.best=zeros(nc);S.cited=zeros(nc*2);
  S.hist=[];S.usedPr=new Set();S.prDone=0;S.prTotal=0;S.shareImg=null;S.screen='play';
  S.sheet=null;S.dialog=null;
  saveSettings();render();renderOverlay();window.scrollTo(0,0);
}
function continueGame(){
  const g=readGame();
  if(!g){clearGame();S.screen='setup';render();return;}
  clearTimers();
  S.nc=g.nc;S.gn=g.gn;S.glevel=g.glevel;S.qs=g.qs;S.spares=g.spares||[];S.i=g.i;S.phase=g.phase;S.marks=g.marks;
  S.pts=g.pts;S.shown=g.pts.slice();S.matches=g.matches;S.conflicts=g.conflicts;S.streak=g.streak;S.best=g.best;S.cited=g.cited;
  S.hist=g.hist||[];S.current=g.current;S.snap=g.snap;S.usedPr=new Set(g.usedPr||[]);S.prDone=g.prDone||0;S.prTotal=g.prTotal||0;
  S.screen='play';S.shareImg=null;S.sheet=null;S.dialog=null;
  render();renderOverlay();window.scrollTo(0,0);
}
function startCount(){
  clearTimers();
  S.phase='count';S.count=3;render();SFX.tick();buzz(15);
  const tick=()=>{
    S.count--;render();
    if(S.count>0){SFX.tick();buzz(15);at(tick,900);}
    else{SFX.go();buzz([30,40,60]);at(()=>{S.phase='mark';render();},1100);}
  };
  at(tick,900);
}
function levelsFor(){return ({leve:[1],media:[2],ousada:[3],mix:[1,2,3]})[S.glevel]||[];}
function pickPrenda(){
  if(S.glevel==='off') return null;
  const lv=levelsFor();
  let p=PRENDAS.filter(x=>lv.includes(x.l)&&!S.usedPr.has(x.id));
  if(!p.length){PRENDAS.filter(x=>lv.includes(x.l)).forEach(x=>S.usedPr.delete(x.id));p=PRENDAS.filter(x=>lv.includes(x.l));}
  const x=pickOne(p);S.usedPr.add(x.id);return x;
}
function snapshot(){
  S.snap={pts:S.pts.slice(),matches:S.matches.slice(),conflicts:S.conflicts.slice(),streak:S.streak.slice(),best:S.best.slice(),cited:S.cited.slice(),
    prDone:S.prDone,prTotal:S.prTotal,usedPr:[...S.usedPr],histLen:S.hist.length};
}
function reveal(){
  if(S.phase!=='mark'||S.marks.some(m=>m===null)) return;
  clearTimers();snapshot();
  const q=S.qs[S.i],mult=q.double?2:1;
  const res=S.marks.map((m,c)=>{
    if(m==='x'){
      S.conflicts[c]++;S.streak[c]=0;
      const p=pickPrenda();if(p) S.prTotal++;
      return {c:c,status:'conflict',who:null,pts:0,combo:false,prenda:p,done:false,quip:pickOne(QUIP_NO)};
    }
    S.matches[c]++;S.streak[c]++;S.best[c]=Math.max(S.best[c],S.streak[c]);S.cited[m]++;
    let pts=mult,combo=false;
    if(S.streak[c]%3===0){pts+=1;combo=true;}
    S.pts[c]+=pts;
    return {c:c,status:'match',who:m,pts:pts,combo:combo,prenda:null,done:false,quip:pickOne(QUIP_OK)};
  });
  S.current=res;
  S.hist.push({q:q.t,double:q.double,res:res.map(r=>({c:r.c,status:r.status,who:r.who}))});
  S.phase='reveal';S.animReveal=true;render();S.animReveal=false;
  const stepMs=S.nc>3?450:650;
  res.forEach((r,k)=>at(()=>{
    if(r.status==='match'){SFX.match();}else{SFX.conflict();buzz(80);}
    S.shown[r.c]=S.pts[r.c];
    const el=document.querySelector('[data-score="'+r.c+'"]');
    if(el){el.textContent=S.pts[r.c];el.classList.remove('bump');void el.offsetWidth;if(r.pts>0) el.classList.add('bump');}
  },400+k*stepMs));
  const allM=res.every(r=>r.status==='match'),allC=res.every(r=>r.status==='conflict'),anyCombo=res.some(r=>r.combo);
  at(()=>{
    if(allM){SFX.combo();confetti(150);}
    else if(anyCombo){SFX.combo();confetti(70);}
    if(allC) shake();
  },400+res.length*stepMs);
}
function undoReveal(){
  if(S.phase!=='reveal'||!S.snap) return;
  clearTimers();
  const s=S.snap;
  S.pts=s.pts.slice();S.matches=s.matches.slice();S.conflicts=s.conflicts.slice();S.streak=s.streak.slice();S.best=s.best.slice();S.cited=s.cited.slice();
  S.prDone=s.prDone;S.prTotal=s.prTotal;S.usedPr=new Set(s.usedPr);S.hist=S.hist.slice(0,s.histLen);
  S.shown=S.pts.slice();S.current=null;S.snap=null;S.phase='mark';
  SFX.swap();toast('Rodada reaberta. Corrija a marcação.');render();
}
function endGame(){
  clearTimers();
  S.screen='end';S.finalPr=pickOne(FINAL_PRENDAS);S.shareImg=null;S.sheet=null;S.dialog=null;
  S.shown=S.pts.slice();
  clearGame();render();renderOverlay();window.scrollTo(0,0);
  SFX.fanfare();confetti(180);at(()=>confetti(120),600);
}
function nextRound(){
  clearTimers();
  S.shown=S.pts.slice();
  S.i++;S.marks=Array.from({length:S.nc},()=>null);S.current=null;S.snap=null;
  if(S.i>=S.qs.length){endGame();return;}
  S.phase='ask';render();window.scrollTo(0,0);
}
function goHome(){
  clearTimers();
  if(S.screen==='play'&&S.phase==='count') S.phase='ask';
  if(S.screen==='play') saveGame();
  S.screen='home';S.sheet=null;S.dialog=null;
  render();renderOverlay();window.scrollTo(0,0);
}
function goSetup(){
  clearTimers();S.screen='setup';S.sheet=null;S.dialog=null;
  render();renderOverlay();window.scrollTo(0,0);
}
function runDialog(){
  const a=S.dialog&&S.dialog.act;
  S.dialog=null;S.sheet=null;renderOverlay();
  if(a==='restart') startGame();
  else if(a==='newgame'){clearGame();goSetup();}
  else if(a==='finish') endGame();
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t) return;
  const act=t.dataset.act;
  switch(act){
    case 'open-menu': openSheet('menu');break;
    case 'open-score': S.sheet=null;openSheet('score');break;
    case 'open-rules': S.sheet=null;openSheet('rules');break;
    case 'close': closeSheet();break;
    case 'dlg-no': S.dialog=null;renderOverlay();break;
    case 'dlg-ok': SFX.click();runDialog();break;
    case 'restart-ask': askDialog('Reiniciar a partida?','Os pontos e as rodadas voltam ao zero. As configurações continuam as mesmas.','Reiniciar','restart',true);break;
    case 'finish-ask': askDialog('Encerrar a partida?','O jogo termina agora e mostra o resultado com o que já foi jogado.','Encerrar','finish',true);break;
    case 'newgame-ask':
      if(S.screen==='play') askDialog('Começar uma nova partida?','A partida atual será descartada.','Descartar e configurar','newgame',true);
      else{clearGame();goSetup();}
      break;
    case 'exit':
      if(S.screen==='play'){goHome();toast('Partida salva. Continue quando quiser.');}else goHome();
      break;
    case 'sound': S.sound=!S.sound;saveSettings();if(S.sound) SFX.click();render();break;
    case 'theme': S.theme=t.dataset.v;saveSettings();applyTheme();SFX.click();renderOverlay();break;
    case 'home': SFX.click();goHome();break;
    case 'setup': SFX.click();goSetup();break;
    case 'continue': SFX.click();continueGame();break;
    case 'nc': SFX.click();S.nc=Number(t.dataset.v);saveSettings();render();break;
    case 'rounds': SFX.click();S.rounds=Number(t.dataset.v);saveSettings();render();break;
    case 'cat': {
      SFX.click();const v=t.dataset.v;
      if(S.cats.has(v)){if(S.cats.size>1) S.cats.delete(v);}else S.cats.add(v);
      saveSettings();render();break;
    }
    case 'level': SFX.click();S.level=t.dataset.v;saveSettings();render();break;
    case 'start': case 'again': SFX.click();startGame();break;
    case 'count': SFX.click();startCount();break;
    case 'swapq':
      if(!S.spares.length){toast('Acabaram as perguntas reservas');break;}
      SFX.swap();{const cur=S.qs[S.i];S.qs[S.i]=Object.assign({},S.spares.pop(),{double:cur.double});}render();break;
    case 'mark': SFX.select();S.marks[Number(t.dataset.c)]=t.dataset.v==='x'?'x':Number(t.dataset.v);render();break;
    case 'reveal': reveal();break;
    case 'undo': undoReveal();break;
    case 'swappr': {
      const r=S.current&&S.current.find(x=>x.c===Number(t.dataset.c));
      if(r&&r.status==='conflict'){
        if(r.done){r.done=false;S.prDone--;}
        const p=pickPrenda();if(p) r.prenda=p;
        SFX.swap();render();
      }
      break;
    }
    case 'done': {
      const r=S.current&&S.current.find(x=>x.c===Number(t.dataset.c));
      if(r&&r.prenda){r.done=!r.done;S.prDone+=r.done?1:-1;if(r.done){SFX.done();confetti(30);}else SFX.click();render();}
      break;
    }
    case 'next': SFX.click();nextRound();break;
    case 'copy':
      SFX.click();
      copyText(shareText()).then(ok=>{
        if(ok) toast('Resultado copiado');
        else{toast('Não deu para copiar. Use o texto abaixo.');const d=document.getElementById('sharebox');if(d) d.open=true;}
      });
      break;
    case 'gencard':
      SFX.click();toast('Gerando o cartão...');
      makeCard().then(url=>{
        S.shareImg=url;render();
        const im=document.getElementById('sharecard');if(im&&im.scrollIntoView) im.scrollIntoView({block:'nearest'});
      }).catch(()=>toast('Não foi possível gerar o cartão'));
      break;
    default: break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='doubles'){S.doubles=t.checked;saveSettings();SFX.click();}
  else if(a==='t-sound'){S.sound=t.checked;saveSettings();if(S.sound) SFX.click();render();}
  else if(a==='t-vib'){S.vibrate=t.checked;saveSettings();if(S.vibrate) buzz(30);}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('nameinput')){S.names[Number(el.dataset.i)]=el.value;saveSettings();}
});
window.addEventListener('popstate',()=>{
  if(hOpen){hOpen=false;S.sheet=null;S.dialog=null;renderOverlay();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.dialog){S.dialog=null;renderOverlay();}
    else if(S.sheet) closeSheet();
  }
});

applyTheme();
render();
</script>

}
