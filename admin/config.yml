backend:
  name: github
  repo: manoelhenri/registros-de-viagem
  branch: main
  base_url: https://registros-de-viagem.pages.dev
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

site_url: https://registros-de-viagem.pages.dev
display_url: https://registros-de-viagem.pages.dev

collections:

  # ---------- Posts do blog ----------
  - name: "posts"
    label: "Posts do blog"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{data}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data da viagem", name: "data", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Foto de capa", name: "capa", widget: "image", required: false, hint: "Aparece no topo do post e na home. Se deixar em branco, mostra um espaço reservado." }
      - { label: "Crédito da foto de capa", name: "capaCredito", widget: "string", required: false, hint: "Obrigatório para fotos de terceiros. Ex: Foto: Nome do autor · CC BY-SA 4.0 · Wikimedia Commons. Deixe em branco se a foto for sua." }
      - { label: "Link da fonte da foto", name: "capaFonte", widget: "string", required: false, hint: "Página original da foto (ex: o link do arquivo no Wikimedia Commons)." }
      - { label: "Coordenadas / rota (texto pequeno acima do título)", name: "coordenadas", widget: "string", required: false, hint: "Nome do lugar em MAIÚSCULAS, sem coordenadas. Ex: LISBOA — ou, para mais de uma parada: LISBOA → PORTO" }
      - { label: "Cidades / pessoas (aparece nos detalhes do post)", name: "cidades", widget: "string", required: false, hint: "Se forem cidades ou parques de verdade, separe por vírgula NA ORDEM DA VIAGEM (ex: Lisboa, Porto, Paris) — essa ordem vira a rota visual do post, e cada nome precisa ser IGUAL ao cadastrado em Destinos ou em Parques para virar link. Se não forem lugares (ex: '6 pessoas'), pode deixar como texto livre." }
      - { label: "Duração", name: "duracao", widget: "string", required: false, hint: "Ex: 14 dias" }
      - { label: "Resumo curto (aparece nos cards da home)", name: "resumo", widget: "text" }
      - { label: "Destacar na home?", name: "destaque", widget: "boolean", default: false, hint: "Só um post deve estar marcado como destaque por vez." }
      - { label: "Localização (mostra um mapa no post)", name: "localizacaoMapa", widget: "string", required: false, hint: "Ex: Lisboa, Portugal. Deixe em branco para não mostrar mapa." }
      - { label: "Texto do post", name: "body", widget: "markdown" }

  # ---------- Página Inicial ----------
  - name: "home"
    label: "Página Inicial"
    files:
      - name: "home"
        label: "Conteúdo da Página Inicial"
        file: "_data/home.json"
        fields:
          - { label: "Legenda (texto pequeno acima do título)", name: "heroEyebrow", widget: "string" }
          - { label: "Título principal", name: "heroTitulo", widget: "string" }
          - { label: "Subtítulo", name: "heroSubtitulo", widget: "text" }
          - { label: "Cartão 1 — Legenda", name: "card1Eyebrow", widget: "string" }
          - { label: "Cartão 1 — Título", name: "card1Titulo", widget: "string" }
          - { label: "Cartão 1 — Texto", name: "card1Texto", widget: "text" }
          - { label: "Cartão 2 — Legenda", name: "card2Eyebrow", widget: "string" }
          - { label: "Cartão 2 — Título", name: "card2Titulo", widget: "string" }
          - { label: "Cartão 2 — Texto", name: "card2Texto", widget: "text" }
          - { label: "Título da seção 'Últimos destinos'", name: "tituloUltimosDestinos", widget: "string" }
          - { label: "Título da seção do Instagram", name: "tituloInstagram", widget: "string" }

  # ---------- Destinos (histórico de viagens) ----------
  - name: "destinos"
    label: "Destinos (histórico de viagens)"
    files:
      - name: "destinos"
        label: "Lista de destinos por país"
        file: "_data/destinosData.json"
        fields:
          - label: "Países"
            name: "destinos"
            widget: "list"
            summary: "{{fields.bandeira}} {{fields.pais}}"
            fields:
              - { label: "Nome do país", name: "pais", widget: "string" }
              - { label: "Bandeira (emoji)", name: "bandeira", widget: "string", hint: "Ex: 🇧🇷" }
              - { label: "Identificador (sem espaços, sem acento)", name: "id", widget: "string", hint: "Ex: brasil, eua, portugal" }
              - label: "Cidades visitadas"
                name: "cidades"
                widget: "list"
                summary: "{{fields.nome}}"
                fields:
                  - { label: "Cidade", name: "nome", widget: "string", hint: "Depois de salvar uma cidade nova, ela só aparece no mapa interativo quando alguém adicionar a coordenada dela em _data/coordsMapa.json no GitHub (veja CONTEXTO-DO-BLOG.md)." }
                  - { label: "Estado / região, país", name: "estado", widget: "string" }
                  - { label: "Anos da visita", name: "anos", widget: "list", field: { label: "Ano", name: "ano", widget: "string" } }
                  - { label: "Mini resumo", name: "resumo", widget: "text" }
                  - { label: "Foto", name: "foto", widget: "image", required: false }

  # ---------- Parques ----------
  - name: "parques"
    label: "Parques visitados"
    files:
      - name: "parques"
        label: "Lista de parques"
        file: "_data/parquesData.json"
        fields:
          - label: "Grupos"
            name: "parques"
            widget: "list"
            summary: "{{fields.icone}} {{fields.grupo}}"
            fields:
              - { label: "Nome do grupo", name: "grupo", widget: "string", hint: "Ex: Parques Temáticos, Parques Aquáticos" }
              - { label: "Ícone (emoji)", name: "icone", widget: "string", hint: "Ex: 🎢" }
              - { label: "Identificador (sem espaços, sem acento)", name: "id", widget: "string" }
              - label: "Parques"
                name: "parques"
                widget: "list"
                summary: "{{fields.nome}}"
                fields:
                  - { label: "Nome do parque", name: "nome", widget: "string", hint: "Depois de salvar um parque novo, ele só aparece no mapa interativo quando alguém adicionar a coordenada dele em _data/coordsMapa.json no GitHub (veja CONTEXTO-DO-BLOG.md)." }
                  - { label: "Local / país", name: "local", widget: "string" }
                  - { label: "Anos da visita", name: "anos", widget: "list", required: false, field: { label: "Ano", name: "ano", widget: "string" } }
                  - { label: "Mini resumo", name: "resumo", widget: "text" }
                  - { label: "Foto", name: "foto", widget: "image", required: false }

  # ---------- Página Sobre ----------
  - name: "sobre"
    label: "Página Sobre"
    files:
      - name: "sobre"
        label: "Conteúdo da página Sobre"
        file: "_data/sobre.json"
        fields:
          - { label: "Seu nome (primeiro nome)", name: "nome", widget: "string" }
          - { label: "Sua foto", name: "foto", widget: "image", required: false }
          - { label: "Texto de apresentação", name: "textoIntro", widget: "text" }
          - { label: "Texto extra", name: "textoExtra", widget: "text" }
          - { label: "Status de viagem (boarding pass)", name: "statusViagem", widget: "string" }
          - { label: "Roteiros publicados", name: "roteirosPublicados", widget: "string" }
          - { label: "Países recentes", name: "paisesRecentes", widget: "string" }
          - { label: "Próximos destinos", name: "proximosDestinos", widget: "string" }

  # ---------- Configurações gerais do site ----------
  - name: "config"
    label: "Configurações do site"
    files:
      - name: "site"
        label: "Nome, Instagram e ano"
        file: "_data/site.json"
        fields:
          - { label: "Seu nome completo (aparece no rodapé)", name: "author", widget: "string" }
          - { label: "Usuário do Instagram (com @)", name: "instagramHandle", widget: "string" }
          - { label: "Link do Instagram", name: "instagramUrl", widget: "string" }
          - { label: "Ano (rodapé)", name: "year", widget: "string" }
          - label: "Posts do Instagram em destaque na home"
            name: "instagramPosts"
            widget: "list"
            required: false
            hint: "Cole o link de posts/reels públicos do Instagram (ex: https://www.instagram.com/p/XXXXXXX/). Deixe vazio para não mostrar nenhum."
            fields:
              - { label: "Link do post", name: "url", widget: "string" }
