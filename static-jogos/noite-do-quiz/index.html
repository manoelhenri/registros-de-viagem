<style>
:root{
  --noite:#1c1030; --noite2:#2a1748; --cripta:#34205a; --borda:#4f3584;
  --lua:#fbf6ff; --nevoa:#c5b4e6; --abobora:#ff8a2a; --abobora-d:#b85510;
  --vela:#ffd66b; --pocao:#9b6bff; --gosma:#7ee36b; --sangue:#ff4d7d;
  --gota:"Rubik Wet Paint","Rubik",system-ui,sans-serif;
  --texto:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--noite);color:var(--lua);font-family:var(--texto);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background-image:
    radial-gradient(120% 70% at 50% 0%, #3a1f66 0%, transparent 62%),
    radial-gradient(100% 45% at 50% 105%, #120a22 0%, transparent 70%);
  background-attachment:fixed}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--vela);outline-offset:3px}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800}

/* lua e morcegos: só no início e no saguão */
.ceu{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.lua{position:absolute;top:calc(7vh - 40px);right:calc(18% - 40px);width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fff8df 0 30%,#ffe7a3 60%,#f2c35c 100%);box-shadow:0 0 60px 10px rgba(255,214,107,.25)}
.morcego{position:absolute;width:34px;height:16px;opacity:.85;animation:voo 14s linear infinite}
.morcego svg{width:100%;height:100%;fill:#0d0618;animation:asa .35s ease-in-out infinite alternate;transform-origin:center}
.morcego:nth-child(2){top:16%;animation-duration:17s;animation-delay:-4s;transform:scale(.8)}
.morcego:nth-child(3){top:28%;animation-duration:21s;animation-delay:-11s}
.morcego:nth-child(4){top:9%;animation-duration:25s;animation-delay:-17s;width:24px}
@keyframes voo{from{left:-12%;translate:0 0}50%{translate:0 26px}to{left:110%;translate:0 0}}
@keyframes asa{to{transform:scaleY(.45)}}
body:not(.no-inicio) .ceu{display:none}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

/* marca */
.marca{font-family:var(--gota);font-weight:400;line-height:.86;color:var(--lua);letter-spacing:.01em}
.marca b{display:block;font-weight:400;color:var(--abobora);font-size:1.62em;text-shadow:0 4px 0 #5a1f00,0 0 34px rgba(255,138,42,.35)}
.marca.grande{font-size:clamp(46px,15vw,64px);margin-top:min(14vh,90px)}
.marca.mini{font-size:22px;line-height:1}
.marca.mini b{display:inline;font-size:1em;text-shadow:0 2px 0 #5a1f00}
.chamada{color:var(--nevoa);font-size:18px;max-width:30ch}

/* blocos */
.bloco{background:linear-gradient(180deg,rgba(52,32,90,.92),rgba(42,23,72,.92));border:1.5px solid var(--borda);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.bloco h2{font-size:20px}
.dica{color:var(--nevoa);font-size:15px}
.aviso{color:var(--sangue);font-size:15px;font-weight:500}
.pilha{display:flex;flex-direction:column;gap:12px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.centro{text-align:center}

/* botões */
.btn{display:block;width:100%;text-align:center;padding:16px 18px;border-radius:16px;font-weight:800;font-size:18px;
  background:var(--abobora);color:#2b1000;box-shadow:0 5px 0 var(--abobora-d);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--abobora-d)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.leve{background:transparent;color:var(--lua);border:2px solid var(--borda);box-shadow:none;font-weight:700}
.btn.leve:active{transform:scale(.985)}
.btn.vela{background:var(--vela);color:#2b1d00;box-shadow:0 5px 0 #a8821f}
.btn.peq{display:inline-block;width:auto;padding:9px 14px;font-size:15px;border-radius:12px}

input[type=text]{width:100%;font:inherit;font-size:19px;padding:14px 16px;border-radius:14px;border:2px solid var(--borda);background:var(--noite);color:var(--lua)}
input.codigo{font-family:var(--gota);font-size:40px;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:10px 0 10px .3em}

/* monstros */
.monstros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mon{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;border-radius:16px;border:2px solid var(--borda);background:var(--noite);font-size:12px;color:var(--nevoa)}
.mon b{font-size:32px;line-height:1.15;font-weight:400}
.mon[aria-pressed=true]{border-color:var(--abobora);background:#4a2414;color:var(--lua)}
.mon[disabled]{opacity:.25}

/* código da sala em lápides */
.lapides{display:flex;justify-content:center;gap:10px;padding:6px 0 2px}
.lapide{width:62px;height:80px;border-radius:30px 30px 8px 8px;background:linear-gradient(180deg,#7a6c95,#4d4168);border:2px solid #9a8cb8;
  display:grid;place-items:center;font-family:var(--gota);font-size:42px;color:var(--lua);box-shadow:0 8px 0 #160b28;text-shadow:0 3px 0 #2a1748}
.lapide:nth-child(odd){rotate:-3deg}.lapide:nth-child(even){rotate:2deg}

/* jogadores */
.gente{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pessoa{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--noite);border:1.5px solid var(--borda);font-weight:700;font-size:14px;min-width:0}
.pessoa .e{font-size:30px;line-height:1.1}
.pessoa .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.pessoa.eu{border-color:var(--vela)}
.pessoa.fora{opacity:.4}
.pessoa .coroa{position:absolute;top:-10px;right:6px;font-size:18px}
.vaga{border-style:dashed;color:var(--nevoa);font-weight:500;justify-content:center;min-height:78px}

/* rodadas */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--noite);padding:5px;border-radius:14px;border:1.5px solid var(--borda)}
.seg button{padding:10px 0;border-radius:10px;font-weight:700;color:var(--nevoa)}
.seg button[aria-pressed=true]{background:var(--pocao);color:#fff}

/* topo do jogo */
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rodada{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;color:var(--nevoa)}
.rodada strong{color:var(--lua);font-size:20px}
.sinal{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gosma);margin-left:8px;vertical-align:middle}
.sinal.off{background:var(--sangue);animation:pisca 1s steps(2) infinite}
@keyframes pisca{50%{opacity:.2}}

/* relógio */
.relogio{display:flex;align-items:center;gap:12px}
.anel{position:relative;width:52px;height:52px;flex:none}
.anel svg{width:100%;height:100%;rotate:-90deg}
.anel circle{fill:none;stroke-width:6}
.anel .fundo{stroke:var(--cripta)}
.anel .frente{stroke:var(--vela);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.anel.fim .frente{stroke:var(--sangue)}
.anel span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.relogio p{color:var(--nevoa);font-size:15px}

/* temas */
.temas{display:grid;gap:10px}
.tema{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--noite);border:2px solid var(--borda);font-weight:800;font-size:19px}
.tema .e{font-size:34px;line-height:1}
.tema[aria-pressed=true]{border-color:var(--abobora);background:#4a2414}
.tema[disabled]:not([aria-pressed=true]){opacity:.5}
.escolhido{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 10px 26px;text-align:center}
.escolhido .e{font-size:84px;line-height:1;animation:surge .5s cubic-bezier(.2,1.6,.4,1) both}
.escolhido h2{font-family:var(--gota);font-weight:400;font-size:40px;line-height:1;color:var(--vela)}
@keyframes surge{from{transform:scale(.2) rotate(-20deg);opacity:0}}

/* pergunta */
.pergunta{font-size:22px;line-height:1.25;font-weight:700;text-wrap:balance}
.tag-tema{color:var(--nevoa);font-weight:500;font-size:15px}
.alts{display:grid;gap:10px}
.alt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 14px 10px 10px;min-height:62px;border-radius:16px;background:var(--noite);border:2px solid var(--borda);font-weight:700;font-size:17px}
.alt .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.alt:nth-child(1) .ic{background:#ff8a2a}.alt:nth-child(2) .ic{background:#9b6bff}.alt:nth-child(3) .ic{background:#2fc6b0}.alt:nth-child(4) .ic{background:#ff4d7d}
.alt[aria-pressed=true]{border-color:var(--vela);background:#3d2a12}
.alt[disabled]{cursor:default}
.alt.certa{border-color:var(--gosma);background:#173a1f}
.alt.errada{border-color:var(--sangue);background:#4a1426}
.alt.apagada{opacity:.45}
.feito{display:flex;flex-wrap:wrap;gap:6px}
.feito span{font-size:22px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--noite);border:1.5px solid var(--borda);opacity:.45}
.feito span.ok{opacity:1;border-color:var(--gosma)}

/* resultado da pergunta */
.resultados{display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--noite)}
.res .pts{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .pts.ok{color:var(--gosma)}.res .pts.nao{color:var(--sangue)}.res .pts.vazio{color:var(--nevoa);font-weight:500}

/* ranking */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:38px 40px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--noite);border:1.5px solid var(--borda)}
.rank li.lider{border-color:var(--vela);background:#3d2a12}
.rank li.eu .nm{color:var(--vela)}
.rank .pos{font-weight:800;font-size:20px;text-align:center;color:var(--nevoa)}
.rank li.lider .pos{color:var(--vela)}
.rank .e{font-size:28px;text-align:center}
.rank .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-weight:800;font-variant-numeric:tabular-nums;font-size:19px;text-align:right}
.rank .ganho{display:block;font-size:13px;font-weight:700;color:var(--gosma)}
.rank .ganho.zero{color:var(--nevoa)}

/* pódio */
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;padding-top:24px}
.degrau{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.degrau .e{font-size:44px;line-height:1}
.degrau.p1 .e{font-size:62px;animation:flutua 2.6s ease-in-out infinite}
.degrau .nm{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.degrau .base{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-weight:800;font-size:26px;color:#2b1000}
.degrau.p1 .base{height:118px;background:var(--vela)}.degrau.p2 .base{height:84px;background:#cfc3e6}.degrau.p3 .base{height:62px;background:var(--abobora)}
.degrau .pt{font-size:13px;color:var(--nevoa);font-weight:500}
@keyframes flutua{50%{transform:translateY(-8px)}}
.campeao{font-family:var(--gota);font-weight:400;font-size:34px;line-height:1.05;color:var(--vela);text-align:center}

/* um celular só: troca de vez */
.vez{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 16px;text-align:center}
.vez .e{font-size:76px;line-height:1}
.vez h2{font-family:var(--gota);font-weight:400;font-size:38px;line-height:1;color:var(--vela)}

.copia{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:12px;border:1.5px solid var(--borda);background:var(--noite);color:var(--lua);resize:none}
.rodape{margin-top:auto;padding-top:10px;text-align:center;color:var(--nevoa);font-size:13px}
.rodape a{color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ceu" aria-hidden="true">
  <div class="lua"></div>
  <div class="morcego" style="top:12%"><svg viewBox="0 0 64 30"><path d="M32 9c2-4 4-5 5-5-1 2 0 4 2 5 6-6 15-8 25-6-6 2-9 7-9 12-4-3-8-3-11 1-2-3-5-4-8-2-1 3-3 6-4 8-1-2-3-5-4-8-3-2-6-1-8 2-3-4-7-4-11-1 0-5-3-10-9-12 10-2 19 0 25 6 2-1 3-3 2-5 1 0 3 1 5 5z"/></svg></div>
  <div class="morcego"><svg viewBox="0 0 64 30"><path d="M32 9c2-4 4-5 5-5-1 2 0 4 2 5 6-6 15-8 25-6-6 2-9 7-9 12-4-3-8-3-11 1-2-3-5-4-8-2-1 3-3 6-4 8-1-2-3-5-4-8-3-2-6-1-8 2-3-4-7-4-11-1 0-5-3-10-9-12 10-2 19 0 25 6 2-1 3-3 2-5 1 0 3 1 5 5z"/></svg></div>
  <div class="morcego"><svg viewBox="0 0 64 30"><path d="M32 9c2-4 4-5 5-5-1 2 0 4 2 5 6-6 15-8 25-6-6 2-9 7-9 12-4-3-8-3-11 1-2-3-5-4-8-2-1 3-3 6-4 8-1-2-3-5-4-8-3-2-6-1-8 2-3-4-7-4-11-1 0-5-3-10-9-12 10-2 19 0 25 6 2-1 3-3 2-5 1 0 3 1 5 5z"/></svg></div>
</div>
<main class="app" id="app" aria-live="polite"></main>

<script type="module">
import { novaPartida, votar, responder, proxima, avancar, publico, pergunta, TEMAS, AVATARES, MAX_JOGADORES, RODADAS_OPCOES, RODADAS_PADRAO, TEMPO } from "./motor.js";

/* ---------- configuração ---------- */
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const SERVIDOR = local ? (new URLSearchParams(location.search).get("servidor") || "ws://127.0.0.1:8787") : "wss://salas.manoelhenrique.com";
const LETRAS_CODIGO = "BCDFGHJKLMNPQRSTVWXZ";
const ICONES = ["🎃", "🔮", "🕸️", "🩸"];

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const guarda = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let pid = guarda.get("nq_pid");
if (!pid || !/^[a-z0-9]{6,24}$/.test(pid)) { pid = Math.random().toString(36).slice(2, 12).padEnd(8, "x"); guarda.set("nq_pid", pid); }

/* ---------- estado da tela ---------- */
const eu = { n: guarda.get("nq_nome") || "", a: guarda.get("nq_av") || "" };
let tela = "inicio";          // inicio | codigo | perfil | saguao | jogo | lconfig
let modo = null;              // "online" | "local"
let acao = null;              // "criar" | "entrar" | "trocar" (no perfil)
let erro = "";

// online
let ws = null, sala = null, g = null, delta = 0, status = "off", codigo = "", tentativas = 0, querConectado = false, criarSala = false, timerReconexao = null;
let meuVoto = null, minhaResp = null;    // {seq, ...}
// um celular só
let G = null, lJog = [], lAv = "", vezPronta = false, vezT0 = 0;

const agoraSrv = () => Date.now() + (modo === "online" ? delta : 0);
const souAnfitriao = () => modo === "local" || (sala && sala.anfitriao === pid);
const visao = () => modo === "local" ? publico(G) : g;

/* ---------- conexão ---------- */
function novoCodigo() { let c = ""; for (let i = 0; i < 4; i++) c += LETRAS_CODIGO[Math.floor(Math.random() * LETRAS_CODIGO.length)]; return c; }

function conectar() {
  clearTimeout(timerReconexao);
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
  status = "conectando"; desenhar();
  let sock;
  try { sock = new WebSocket(`${SERVIDOR}/sala/${codigo}`); } catch (e) { return falhou(); }
  ws = sock;
  sock.onopen = () => sock.send(JSON.stringify({ t: "entrar", pid, n: eu.n, a: eu.a, criar: criarSala }));
  sock.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.t === "ok") { status = "on"; tentativas = 0; criarSala = false; modo = "online"; erro = "";
      if (m.a && m.a !== eu.a) { eu.a = m.a; guarda.set("nq_av", eu.a); }
      history.replaceState(null, "", "?sala=" + codigo); return; }
    if (m.t === "erro") return erroSala(m.e);
    if (m.t === "pong") return;
    if (m.t === "estado") {
      delta = m.agora - Date.now(); sala = m.sala;
      const antes = g; g = m.g;
      if (g && antes && g.seq !== antes.seq && g.fase === "revela") { const u = g.ultimo[pid]; if (u) vibrar(u.pts ? [30, 40, 30] : 120); }
      tela = g ? "jogo" : (tela === "perfil" ? "perfil" : "saguao");
      desenhar();
    }
  };
  sock.onclose = () => { if (ws !== sock) return; ws = null; if (status === "on" || status === "conectando") falhou(); };
  sock.onerror = () => {};
}
function falhou() {
  status = "off"; desenhar();
  if (!querConectado) return;
  tentativas++;
  if (tentativas > 3 && modo !== "online") { querConectado = false; erro = "Não deu para conectar ao servidor das salas. Confira a internet ou jogue no modo de um celular só."; tela = "inicio"; return desenhar(); }
  timerReconexao = setTimeout(conectar, Math.min(8000, 800 * 2 ** Math.min(tentativas, 4)));
}
function erroSala(e) {
  if (e === "ocupada" && criarSala) { codigo = novoCodigo(); return conectar(); }
  const msgs = { cheia: "Essa sala já tem 10 jogadores.", inexistente: `Não existe sala com o código ${codigo}. Confira as letras com quem criou.`, dados: "Escreva seu nome para entrar.", poucos: "Precisa de pelo menos 2 jogadores conectados para começar.", fora: "" };
  if (e === "poucos") { erro = msgs.poucos; return desenhar(); }
  if (e === "fora") return conectar();
  sair(msgs[e] || "Não foi possível entrar na sala.");
}
function mandar(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function sair(msg) {
  querConectado = false; clearTimeout(timerReconexao);
  if (ws) { try { mandar({ t: "sair" }); ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  modo = null; sala = null; g = null; status = "off"; erro = msg || ""; tela = "inicio";
  history.replaceState(null, "", location.pathname); desenhar(true);
}
setInterval(() => mandar({ t: "ping" }), 25000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (querConectado && (!ws || ws.readyState > 1)) { tentativas = 0; conectar(); }
  if ((modo === "online" && g) || (modo === "local" && G)) acordar();
});
let trava = null;
async function acordar() { try { if (navigator.wakeLock && !trava) { trava = await navigator.wakeLock.request("screen"); trava.addEventListener("release", () => (trava = null)); } } catch (e) {} }

/* ---------- pedaços de tela ---------- */
const marcaMini = () => `<div class="marca mini">Noite do <b>Quiz</b></div>`;
function topo(v) {
  const s = modo === "online" ? `<span class="sinal ${status === "on" ? "" : "off"}" role="img" aria-label="${status === "on" ? "Conectado" : "Reconectando"}"></span>` : "";
  return `<div class="topo">${marcaMini()}<div class="rodada">Rodada <strong>${v.rodada}</strong>/${v.rodadas}${s}</div></div>`;
}
function relogio(v, txt) {
  return `<div class="relogio"><div class="anel" id="anel"><svg viewBox="0 0 52 52"><circle class="fundo" cx="26" cy="26" r="22"/><circle class="frente" id="anelF" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><span id="anelN"></span></div><p>${txt}</p></div>`;
}
function feitoHTML(v) {
  return `<div class="feito" aria-label="Quem já foi">${v.jogadores.map((p) => `<span class="${v.feito.includes(p.id) ? "ok" : ""}" title="${esc(p.n)}">${esc(p.a)}</span>`).join("")}</div>`;
}
const monstros = (sel, usados, attr) => `<div class="monstros" role="group" aria-label="Escolha seu monstro">${AVATARES.map(([e, n]) => `<button class="mon" data-${attr}="${e}" aria-pressed="${sel === e}" ${usados.includes(e) && sel !== e ? "disabled" : ""}><b>${e}</b>${n}</button>`).join("")}</div>`;
const lapides = (c) => `<div class="lapides" aria-label="Código da sala ${c.split("").join(" ")}">${c.split("").map((l) => `<span class="lapide">${l}</span>`).join("")}</div>`;

/* ---------- telas fora da partida ---------- */
function tInicio() {
  const temSala = new URLSearchParams(location.search).get("sala");
  return `
  <h1 class="marca grande">Noite do <b>Quiz</b></h1>
  <p class="chamada">Quiz de Halloween para jogar em grupo. Vote no tema, responda rápido e suba no ranking.</p>
  ${erro ? `<p class="aviso" role="alert">${esc(erro)}</p>` : ""}
  <div class="bloco">
    <h2>Cada um no seu celular</h2>
    <p class="dica">De 2 a 10 jogadores. Quem cria a sala passa o código para os outros.</p>
    <button class="btn" data-acao="criar">Criar sala</button>
    <button class="btn leve" data-acao="tenhocodigo">Entrar com código</button>
  </div>
  <div class="bloco">
    <h2>Um celular só</h2>
    <p class="dica">Até 10 jogadores passando o celular de mão em mão. Funciona sem internet.</p>
    <button class="btn leve" data-acao="local">Jogar passando o celular</button>
  </div>
  <p class="rodape"><a href="../">Mais jogos</a></p>`;
}
function tCodigo() {
  return `
  <div class="topo">${marcaMini()}<button class="btn leve peq" data-acao="inicio">Voltar</button></div>
  <div class="bloco">
    <h2>Qual é o código da sala?</h2>
    <p class="dica">São 4 letras. Quem criou a sala vê o código no saguão.</p>
    <input type="text" class="codigo" id="cod" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" value="${esc(codigo)}" aria-label="Código da sala">
    ${erro ? `<p class="aviso" role="alert">${esc(erro)}</p>` : ""}
    <button class="btn" data-acao="codigook">Continuar</button>
  </div>`;
}
function tPerfil() {
  const usados = sala ? sala.membros.filter((m) => m.id !== pid).map((m) => m.a) : [];
  const rotulo = acao === "criar" ? "Criar sala" : acao === "trocar" ? "Salvar" : `Entrar na sala ${esc(codigo)}`;
  return `
  <div class="topo">${marcaMini()}<button class="btn leve peq" data-acao="${acao === "trocar" ? "volta-saguao" : "inicio"}">Voltar</button></div>
  <div class="bloco">
    <label for="nome"><h2>Seu nome</h2></label>
    <input type="text" id="nome" maxlength="16" placeholder="Como os outros vão te ver" value="${esc(eu.n)}" autocomplete="nickname">
    <h2>Seu monstro</h2>
    ${monstros(eu.a, usados, "av")}
    ${erro ? `<p class="aviso" role="alert">${esc(erro)}</p>` : ""}
    <button class="btn" data-acao="perfilok" ${eu.n && eu.a ? "" : "disabled"}>${rotulo}</button>
  </div>`;
}
function tSaguao() {
  if (!sala) return `<div class="topo">${marcaMini()}</div><div class="bloco centro"><p class="dica">${status === "off" ? "Reconectando à sala…" : "Entrando na sala…"}</p></div>`;
  const on = sala.membros.filter((m) => m.on);
  const host = souAnfitriao();
  const vagas = Math.max(0, Math.min(2, MAX_JOGADORES - sala.membros.length));
  const nomeHost = (sala.membros.find((m) => m.id === sala.anfitriao) || {}).n || "o anfitrião";
  return `
  <div class="topo">${marcaMini()}<button class="btn leve peq" data-acao="sair">Sair</button></div>
  <div class="bloco centro">
    <p class="dica">Código da sala</p>
    ${lapides(sala.codigo)}
    <button class="btn vela" data-acao="convidar">Convidar pelo link</button>
    <div id="copia"></div>
  </div>
  <div class="bloco">
    <div class="linha" style="justify-content:space-between"><h2>Na sala (${on.length}/${MAX_JOGADORES})</h2><button class="btn leve peq" data-acao="trocar">Trocar monstro</button></div>
    <div class="gente">${sala.membros.map((m) => `<div class="pessoa ${m.id === pid ? "eu" : ""} ${m.on ? "" : "fora"}">${m.id === sala.anfitriao ? `<span class="coroa" title="Anfitrião">👑</span>` : ""}<span class="e">${esc(m.a)}</span><span class="n">${esc(m.n)}</span></div>`).join("")}${Array.from({ length: vagas }, () => `<div class="pessoa vaga">vaga</div>`).join("")}</div>
  </div>
  ${host ? `
  <div class="bloco">
    <h2>Quantas rodadas?</h2>
    <div class="seg" role="group" aria-label="Rodadas">${RODADAS_OPCOES.map((r) => `<button data-rodadas="${r}" aria-pressed="${sala.rodadas === r}">${r}</button>`).join("")}</div>
    ${erro ? `<p class="aviso" role="alert">${esc(erro)}</p>` : ""}
    <button class="btn" data-acao="comecar" ${on.length < 2 ? "disabled" : ""}>${on.length < 2 ? "Esperando mais alguém entrar" : `Começar com ${on.length} jogadores`}</button>
  </div>` : `<div class="bloco centro"><p class="dica">Esperando ${esc(nomeHost)} começar o jogo (${sala.rodadas} rodadas).</p></div>`}`;
}
function tLocalConfig() {
  const usados = lJog.map((p) => p.a);
  return `
  <div class="topo">${marcaMini()}<button class="btn leve peq" data-acao="inicio">Voltar</button></div>
  <div class="bloco">
    <h2>Jogadores (${lJog.length}/${MAX_JOGADORES})</h2>
    ${lJog.length ? `<div class="gente">${lJog.map((p, i) => `<button class="pessoa" data-tira="${i}" aria-label="Tirar ${esc(p.n)}"><span class="e">${esc(p.a)}</span><span class="n">${esc(p.n)}</span><span class="dica" style="font-size:12px">tirar</span></button>`).join("")}</div>` : `<p class="dica">Adicione pelo menos 2 jogadores.</p>`}
  </div>
  ${lJog.length < MAX_JOGADORES ? `
  <div class="bloco">
    <label for="nome"><h2>Nome do jogador ${lJog.length + 1}</h2></label>
    <input type="text" id="nome" maxlength="16" placeholder="Nome" autocomplete="off">
    ${monstros(lAv, usados, "lav")}
    <button class="btn leve" data-acao="ladd">Adicionar jogador</button>
  </div>` : ""}
  <div class="bloco">
    <h2>Quantas rodadas?</h2>
    <div class="seg" role="group" aria-label="Rodadas">${RODADAS_OPCOES.map((r) => `<button data-lrodadas="${r}" aria-pressed="${lRodadas === r}">${r}</button>`).join("")}</div>
    <button class="btn" data-acao="lcomecar" ${lJog.length < 2 ? "disabled" : ""}>Começar o jogo</button>
  </div>`;
}
let lRodadas = RODADAS_PADRAO;

/* ---------- telas da partida ---------- */
function vezLocal(campo) { return G ? G.jogadores.find((p) => !G[campo][p.id]) : null; }

function tVoto(v) {
  if (modo === "local") {
    const p = vezLocal("votos");
    if (!p) return `${topo(v)}<div class="bloco vez"><p class="dica">Contando os votos…</p></div>`;
    return `${topo(v)}
    <p class="tag-tema">Vez de ${esc(p.a)} ${esc(p.n)} votar no tema</p>
    <div class="temas">${v.opcoes.map((k) => `<button class="tema" data-voto="${k}"><span class="e">${TEMAS[k].e}</span>${esc(TEMAS[k].n)}</button>`).join("")}</div>
    ${feitoHTML(v)}`;
  }
  const meu = meuVoto && meuVoto.seq === v.seq ? meuVoto.t : null;
  const ja = meu || v.feito.includes(pid);
  const dentro = v.jogadores.some((p) => p.id === pid);
  return `${topo(v)}
  ${relogio(v, ja ? "Voto registrado. Esperando os outros." : "Vote no tema da rodada")}
  <div class="temas">${v.opcoes.map((k) => `<button class="tema" data-voto="${k}" aria-pressed="${meu === k}" ${ja || !dentro ? "disabled" : ""}><span class="e">${TEMAS[k].e}</span>${esc(TEMAS[k].n)}</button>`).join("")}</div>
  ${feitoHTML(v)}`;
}
function tTema(v) {
  const t = TEMAS[v.tema];
  const votos = v.opcoes.map((k) => `${TEMAS[k].e} ${v.contagem[k] || 0} voto${(v.contagem[k] || 0) === 1 ? "" : "s"}`).join(", ");
  return `${topo(v)}
  <div class="bloco escolhido"><p class="dica">O tema da rodada é</p><span class="e">${t.e}</span><h2>${esc(t.n)}</h2><p class="dica">${votos}</p></div>`;
}
function tPergunta(v) {
  const [texto, alts] = pergunta(v.qid);
  const tag = `<p class="tag-tema">${TEMAS[v.tema].e} ${esc(TEMAS[v.tema].n)}</p>`;
  if (modo === "local") {
    const p = vezLocal("respostas");
    if (!p) return `${topo(v)}<div class="bloco vez"><p class="dica">Conferindo as respostas…</p></div>`;
    if (!vezPronta) return `${topo(v)}
      <div class="bloco vez"><span class="e">${esc(p.a)}</span><h2>Vez de ${esc(p.n)}</h2><p class="dica">Passe o celular para ${esc(p.n)}. Ninguém espia!</p><button class="btn" data-acao="pronto">Estou pronto</button></div>`;
    return `${topo(v)}${tag}${relogio(v, `${esc(p.n)} respondendo`)}
      <p class="pergunta">${esc(texto)}</p>
      <div class="alts">${v.ordem.map((oi, i) => `<button class="alt" data-resp="${oi}"><span class="ic" aria-hidden="true">${ICONES[i]}</span><span>${esc(alts[oi])}</span></button>`).join("")}</div>`;
  }
  const minha = minhaResp && minhaResp.seq === v.seq ? minhaResp.c : null;
  const ja = minha !== null || v.feito.includes(pid);
  const dentro = v.jogadores.some((p) => p.id === pid);
  return `${topo(v)}${tag}${relogio(v, ja ? "Resposta enviada. Esperando os outros." : "Quem acerta mais rápido ganha mais pontos")}
  <p class="pergunta">${esc(texto)}</p>
  <div class="alts">${v.ordem.map((oi, i) => `<button class="alt" data-resp="${oi}" aria-pressed="${minha === oi}" ${ja || !dentro ? "disabled" : ""}><span class="ic" aria-hidden="true">${ICONES[i]}</span><span>${esc(alts[oi])}</span></button>`).join("")}</div>
  ${feitoHTML(v)}`;
}
function tRevela(v) {
  const [texto, alts] = pergunta(v.qid);
  const minha = modo === "online" && v.ultimo[pid] ? v.ultimo[pid].c : null;
  const lista = v.jogadores.slice().sort((a, b) => (v.ultimo[b.id]?.pts || 0) - (v.ultimo[a.id]?.pts || 0));
  return `${topo(v)}
  <p class="pergunta">${esc(texto)}</p>
  <div class="alts">${v.ordem.map((oi, i) => `<div class="alt ${oi === 0 ? "certa" : oi === minha ? "errada" : "apagada"}"><span class="ic" aria-hidden="true">${oi === 0 ? "✅" : ICONES[i]}</span><span>${esc(alts[oi])}</span></div>`).join("")}</div>
  <div class="bloco"><h2>Como cada um foi</h2><div class="resultados">${lista.map((p) => { const u = v.ultimo[p.id] || { pts: 0, c: -1 };
    return `<div class="res"><span>${esc(p.a)} ${esc(p.n)}</span><span class="pts ${u.pts ? "ok" : u.c === -1 ? "vazio" : "nao"}">${u.pts ? "+" + u.pts : u.c === -1 ? "não respondeu" : "errou"}</span></div>`; }).join("")}</div></div>`;
}
function ranking(v, comGanho) {
  const ord = v.jogadores.slice().sort((a, b) => (v.pontos[b.id] || 0) - (v.pontos[a.id] || 0));
  let ult = null, pos = 0;
  return `<ol class="rank">${ord.map((p, i) => { const s = v.pontos[p.id] || 0; if (s !== ult) { pos = i + 1; ult = s; }
    const gnh = comGanho && v.ultimo[p.id] ? v.ultimo[p.id].pts : 0;
    return `<li class="${pos === 1 ? "lider" : ""} ${modo === "online" && p.id === pid ? "eu" : ""}"><span class="pos">${pos}º</span><span class="e">${esc(p.a)}</span><span class="nm">${esc(p.n)}</span><span class="sc">${s}${comGanho ? `<span class="ganho ${gnh ? "" : "zero"}">+${gnh}</span>` : ""}</span></li>`; }).join("")}</ol>`;
}
function tRanking(v) {
  const ultima = v.rodada >= v.rodadas;
  return `${topo(v)}
  <h2>Ranking depois da rodada ${v.rodada}</h2>
  ${ranking(v, true)}
  ${souAnfitriao() ? `<button class="btn" data-acao="proxima">${ultima ? "Ver quem venceu" : "Próxima rodada"}</button>` : ""}
  ${modo === "online" ? relogio(v, ultima ? "O resultado aparece sozinho em instantes" : "A próxima rodada começa sozinha") : ""}`;
}
function tFim(v) {
  const ord = v.jogadores.slice().sort((a, b) => (v.pontos[b.id] || 0) - (v.pontos[a.id] || 0));
  const max = v.pontos[ord[0].id] || 0;
  const camp = ord.filter((p) => (v.pontos[p.id] || 0) === max);
  const posDe = (p) => 1 + ord.filter((x) => (v.pontos[x.id] || 0) > (v.pontos[p.id] || 0)).length;
  const deg = (p, n) => p ? `<div class="degrau p${n}"><span class="e">${esc(p.a)}</span><span class="nm">${esc(p.n)}</span><span class="pt">${v.pontos[p.id] || 0} pts</span><div class="base">${posDe(p)}º</div></div>` : `<div></div>`;
  const host = souAnfitriao();
  return `${marcaMini()}
  <p class="campeao">${camp.length > 1 ? `Empate! ${camp.map((c) => esc(c.n)).join(" e ")} dominam a noite` : `${esc(camp[0].n)} dominou a noite`}</p>
  <div class="podio">${deg(ord[1], 2)}${deg(ord[0], 1)}${deg(ord[2], 3)}</div>
  ${ranking(v, false)}
  ${host ? `<button class="btn" data-acao="denovo">Jogar de novo</button><button class="btn leve" data-acao="${modo === "local" ? "lvolta" : "saguao"}">${modo === "local" ? "Trocar jogadores" : "Voltar ao saguão"}</button>`
    : `<p class="dica centro">Quem criou a sala pode começar outra partida.</p><button class="btn leve" data-acao="sair">Sair da sala</button>`}`;
}

/* ---------- desenho ---------- */
let ultimaChave = "";
function desenhar(forcar) {
  const v = (tela === "jogo") ? visao() : null;
  document.body.classList.toggle("no-inicio", tela === "inicio");
  let html, chave;
  if (v) {
    chave = JSON.stringify([v.seq, v.fase, v.feito, status, meuVoto, minhaResp, vezPronta, sala && sala.anfitriao, G && [G.votos, G.respostas]]);
    if (!forcar && chave === ultimaChave) return;
    html = { voto: tVoto, tema: tTema, pergunta: tPergunta, revela: tRevela, ranking: tRanking, fim: tFim }[v.fase](v);
  } else {
    if (!forcar && (tela === "perfil" || tela === "codigo" || tela === "lconfig") && document.activeElement && document.activeElement.tagName === "INPUT") return;
    chave = JSON.stringify([tela, sala, status, erro, acao]);
    if (!forcar && chave === ultimaChave) return;
    html = { inicio: tInicio, codigo: tCodigo, perfil: tPerfil, saguao: tSaguao, lconfig: tLocalConfig }[tela]();
  }
  ultimaChave = chave;
  $("#app").innerHTML = html;
  relogioTick();
}

function relogioTick() {
  const f = $("#anelF"), n = $("#anelN"); if (!f) return;
  const v = visao(); if (!v) return;
  let total, fim;
  if (modo === "local" && v.fase === "pergunta") { total = TEMPO.pergunta; fim = vezT0 + total; }
  else { if (!v.prazo) return; total = TEMPO[v.fase]; fim = v.prazo; }
  const resta = Math.max(0, fim - agoraSrv());
  f.style.strokeDashoffset = String(138.2 * (1 - resta / total));
  n.textContent = Math.ceil(resta / 1000);
  $("#anel").classList.toggle("fim", resta < 5000);
}

// relógio e, no modo de um celular só, o motor do jogo
setInterval(() => {
  if (modo === "local" && G) {
    if (G.fase === "pergunta" && vezPronta && Date.now() - vezT0 > TEMPO.pergunta) respLocal(-1);
    const n = avancar(G, Date.now());
    if (n !== G) { G = n; if (G.fase === "pergunta") vezPronta = false; desenhar(); }
  }
  relogioTick();
}, 200);

/* ---------- ações ---------- */
function respLocal(c) {
  const p = vezLocal("respostas"); if (!p || !vezPronta) return;
  G = responder(G, p.id, c, Date.now(), Date.now() - vezT0);
  vezPronta = false; desenhar();
}
async function convidar() {
  const link = `${location.origin}${location.pathname}?sala=${sala.codigo}`;
  const texto = `Bora jogar o Noite do Quiz! Entre na sala ${sala.codigo}: ${link}`;
  try { if (navigator.share) { await navigator.share({ title: "Noite do Quiz", text: texto }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(texto); $("#copia").innerHTML = `<p class="dica">Convite copiado. Cole no grupo da galera.</p>`; return; } catch (e) {}
  $("#copia").innerHTML = `<textarea class="copia" rows="3" readonly aria-label="Convite para copiar">${esc(texto)}</textarea>`;
  $("#copia textarea").select();
}

document.addEventListener("input", (e) => {
  if (e.target.id === "nome" && tela === "perfil") { eu.n = e.target.value.trim().slice(0, 16); const b = $('[data-acao="perfilok"]'); if (b) b.disabled = !(eu.n && eu.a); }
  if (e.target.id === "cod") { const c = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (c !== e.target.value) e.target.value = c; codigo = c; }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "cod") $('[data-acao="codigook"]').click();
  if (e.target.id === "nome") { const b = $('[data-acao="perfilok"]') || $('[data-acao="ladd"]'); if (b && !b.disabled) b.click(); }
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.av) { eu.a = d.av; document.querySelectorAll("[data-av]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.av === eu.a)); const b = $('[data-acao="perfilok"]'); if (b) b.disabled = !(eu.n && eu.a); return; }
  if (d.lav) { lAv = d.lav; document.querySelectorAll("[data-lav]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lav === lAv)); return; }
  if (d.tira) { lJog.splice(+d.tira, 1); return desenhar(true); }
  if (d.rodadas) { mandar({ t: "rodadas", r: +d.rodadas }); return; }
  if (d.lrodadas) { lRodadas = +d.lrodadas; return desenhar(true); }
  if (d.voto) {
    if (modo === "local") { const p = vezLocal("votos"); if (p) G = votar(G, p.id, d.voto, Date.now()); vibrar(15); return desenhar(); }
    meuVoto = { seq: g.seq, t: d.voto }; mandar({ t: "votar", tema: d.voto }); vibrar(15); return desenhar();
  }
  if (d.resp !== undefined) {
    const c = +d.resp;
    if (modo === "local") return respLocal(c);
    minhaResp = { seq: g.seq, c }; mandar({ t: "responder", c }); vibrar(15); return desenhar();
  }
  const a = d.acao; erro = erro && a ? "" : erro;
  if (a === "inicio") { tela = "inicio"; modo = null; G = null; }
  else if (a === "criar") { acao = "criar"; tela = "perfil"; }
  else if (a === "tenhocodigo") { tela = "codigo"; }
  else if (a === "codigook") { if (codigo.length !== 4) { erro = "O código tem 4 letras."; } else { acao = "entrar"; tela = "perfil"; } }
  else if (a === "perfilok") {
    eu.n = ($("#nome").value || "").trim().slice(0, 16); if (!eu.n || !eu.a) return;
    guarda.set("nq_nome", eu.n); guarda.set("nq_av", eu.a);
    if (acao === "trocar") { mandar({ t: "perfil", n: eu.n, a: eu.a }); tela = "saguao"; }
    else { criarSala = acao === "criar"; if (criarSala) codigo = novoCodigo(); querConectado = true; tentativas = 0; sala = null; g = null; tela = "saguao"; conectar(); }
  }
  else if (a === "trocar") { acao = "trocar"; tela = "perfil"; }
  else if (a === "volta-saguao") { tela = "saguao"; }
  else if (a === "convidar") { convidar(); return; }
  else if (a === "comecar") { mandar({ t: "comecar" }); acordar(); return; }
  else if (a === "proxima") { if (modo === "local") { G = proxima(G, Date.now()); } else mandar({ t: "proxima" }); }
  else if (a === "denovo") {
    if (modo === "local") { G = novaPartida(G.jogadores, Date.now(), { rodadas: G.rodadas, local: true }); vezPronta = false; }
    else { meuVoto = minhaResp = null; mandar({ t: "denovo" }); return; }
  }
  else if (a === "saguao") { mandar({ t: "saguao" }); return; }
  else if (a === "sair") { return sair(); }
  else if (a === "local") { modo = "local"; tela = "lconfig"; }
  else if (a === "ladd") {
    const n = ($("#nome").value || "").trim().slice(0, 16);
    if (!n) { $("#nome").focus(); return; }
    if (!lAv) lAv = AVATARES.map((x) => x[0]).find((x) => !lJog.some((p) => p.a === x));
    lJog.push({ id: "j" + lJog.length + Math.random().toString(36).slice(2, 6), n, a: lAv }); lAv = "";
    desenhar(true); const i = $("#nome"); if (i) i.focus(); return;
  }
  else if (a === "lcomecar") { if (lJog.length < 2) return; G = novaPartida(lJog.slice(), Date.now(), { rodadas: lRodadas, local: true }); vezPronta = false; tela = "jogo"; acordar(); }
  else if (a === "lvolta") { G = null; tela = "lconfig"; }
  else if (a === "pronto") { vezPronta = true; vezT0 = Date.now(); }
  desenhar(true);
});

/* ---------- início ---------- */
const doLink = (new URLSearchParams(location.search).get("sala") || "").toUpperCase().replace(/[^A-Z]/g, "");
if (doLink.length === 4) { codigo = doLink; acao = "entrar"; tela = "perfil"; }
desenhar(true);
</script>
