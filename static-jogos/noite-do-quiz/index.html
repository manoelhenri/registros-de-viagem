<style>
/* Layout: one-screen phone app, a single stage card per phase, sticky scoreline on top.
   Single committed look: a candle-lit horror night (works on any host background). */
:root{
  --bg:#110b10; --bg2:#1c1219; --panel:#241820; --line:#3b2833;
  --bone:#f1e7d6; --muted:#b39fa6; --blood:#d4183a; --blood-d:#8e0f27;
  --pumpkin:#ff8a1f; --ok:#4fd27f; --bad:#ff4d6a;
  --display:"Creepster", "Impact", fantasy;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:radial-gradient(120% 60% at 50% -10%, #3a1020 0%, transparent 60%),radial-gradient(80% 40% at 50% 110%, #2a0f05 0%, transparent 70%);
  background-attachment:fixed}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 32px}
h1,h2,h3{margin:0;text-wrap:balance}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95;color:var(--blood);letter-spacing:.02em;text-shadow:0 2px 0 #000,0 0 24px rgba(212,24,58,.35)}
.logo span{color:var(--bone)}
.kicker{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1;color:var(--pumpkin)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pumpkin);outline-offset:2px}
.btn{background:var(--blood);color:#fff;font-weight:800;font-size:1.05rem;padding:15px 18px;border-radius:12px;box-shadow:0 4px 0 var(--blood-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blood-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--bone)}
.btn.alt{background:var(--pumpkin);color:#1a0d00;box-shadow:0 4px 0 #a5520b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);color:var(--bone)}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);font-size:.72rem;color:var(--muted)}
.av b{font-size:1.9rem;line-height:1.1}
.av[aria-pressed=true]{border-color:var(--pumpkin);background:#3a2312;color:var(--bone)}
.av[disabled]{opacity:.3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:600}
.chip .e{font-size:1.3rem}
.chip.done{border-color:var(--ok)}
.chip.done::after{content:"✓";color:var(--ok);font-weight:800}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.round{font-weight:800;font-variant-numeric:tabular-nums}
.round small{color:var(--muted);font-weight:600}
.themes{display:grid;gap:10px}
.theme{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:14px;background:var(--bg2);border:2px solid var(--line);font-weight:800;font-size:1.15rem}
.theme .e{font-size:2rem}
.theme[aria-pressed=true]{border-color:var(--pumpkin);background:#3a2312}
.timer{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blood),var(--pumpkin));transform-origin:left;transition:transform .25s linear}
.tnum{font-variant-numeric:tabular-nums;font-weight:800;color:var(--pumpkin)}
.question{font-size:1.3rem;font-weight:800;line-height:1.25;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:12px;background:var(--bg2);border:2px solid var(--line);font-weight:600;font-size:1.05rem}
.opt .L{flex:0 0 32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--line);font-weight:800}
.opt[aria-pressed=true]{border-color:var(--pumpkin)}
.opt.right{border-color:var(--ok);background:#12301f}
.opt.right .L{background:var(--ok);color:#06200f}
.opt.wrong{border-color:var(--bad);background:#3a1119}
.opt[disabled]{cursor:default}
.res{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg2)}
.res .pts{font-weight:800;font-variant-numeric:tabular-nums}
.res .pts.ok{color:var(--ok)} .res .pts.no{color:var(--bad)}
.rank{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.rank li{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.rank li.first{border-color:var(--pumpkin);background:#33200f}
.rank .pos{font-family:var(--display);font-size:1.6rem;color:var(--muted);text-align:center}
.rank li.first .pos{color:var(--pumpkin)}
.rank .e{font-size:1.8rem}
.rank .nm{font-weight:800;min-width:0;overflow-wrap:anywhere}
.rank .sc{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.15rem}
.rank .gain{display:block;font-size:.75rem;color:var(--ok);font-weight:600}
.champ{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.champ .e{font-size:5rem;line-height:1;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.reveal-theme{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:24px 16px}
.reveal-theme .e{font-size:4.5rem;line-height:1}
.pass{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px 16px}
.pass .e{font-size:4.5rem;line-height:1}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem}
.center{text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);

const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function peersList(){ return room ? room.peers() : []; }
function hostPeer(){
  let best=null;
  for (const p of peersList()){ const g=p.presence && p.presence.g; if(p.presence && p.presence.host && (!best || ((g&&g.seq)||0) > ((best.presence.g&&best.presence.g.seq)||0))) best=p; }
  return best;
}
function lobbyPlayers(){
  const seen = {}, out = [];
  if (me.joined) { seen[me.pid]=1; out.push({id:me.pid,n:me.n,a:me.a}); }
  for (const p of peersList()){
    const m = p.presence && p.presence.me;
    if (!m || typeof m.n!=="string" || !m.n || typeof m.pid!=="string" || seen[m.pid]) continue;
    seen[m.pid]=1; out.push({id:m.pid, n:m.n.slice(0,16), a:String(m.a||"👻").slice(0,8)});
  }
  return out;
}
function inputsOf(id){
  if (mode==="local") return localIn[id] || {};
  if (id===me.pid) return myIn;
  for (const p of peersList()){ const pr=p.presence; if (pr && pr.me && pr.me.pid===id) return {vote:pr.vote, ans:pr.ans}; }
  return {};
}
function view(){ // estado que esta tela mostra
  if (mode==="local" || isHost) return G;
  if (mode!=="online" || !me.joined) return null;
  const h = hostPeer(); return h ? (h.presence.g || null) : null;
}

/* ---------------- Motor do anfitrião ---------------- */
function broadcast(){ if (mode==="online" && room) room.presence({host:true, g:G}).catch(()=>{}); }
function setPhase(phase, extra){
  G = Object.assign({}, G, extra||{}, {phase, seq:(G.seq||0)+1, done:[]});
  if (phase==="vote"||phase==="q"){ localTurn=0; turnReady=false; }
  phaseT0 = Date.now(); broadcast(); render();
}
function pickOpts(exclude){ return shuffle(Object.keys(THEMES).filter(k=>k!==exclude)).slice(0,3); }
function startGame(players){
  const scores = {}; players.forEach(p=>scores[p.id]=0);
  G = {v:1, gid:Math.random().toString(36).slice(2,8), seq:0, phase:"vote", round:1, players, scores, last:{}, used:[], opts:pickOpts(null), theme:null, tally:{}, done:[]};
  localIn = {}; myIn = {vote:null, ans:null}; localTurn = 0; turnReady=false;
  phaseT0 = Date.now(); G.seq = 1; broadcast(); render(); wake();
}
function finishVote(){
  const tally = {}; G.opts.forEach(k=>tally[k]=0);
  G.players.forEach(p=>{ const v=inputsOf(p.id).vote; if (cur(v,G) && tally[v.t]!==undefined) tally[v.t]++; });
  const max = Math.max(...Object.values(tally));
  const theme = shuffle(G.opts.filter(k=>tally[k]===max))[0];
  setPhase("theme", {theme, tally});
}
function askQuestion(){
  const all = Q[G.theme].map((_,i)=>G.theme+"-"+i);
  let pool = all.filter(id=>!G.used.includes(id)); if (!pool.length) pool = all;
  const qid = shuffle(pool)[0];
  setPhase("q", {qid, order:shuffle([0,1,2,3]), used:G.used.concat(qid)});
}
function finishQ(){
  const scores = Object.assign({}, G.scores), last = {};
  G.players.forEach(p=>{
    const a = inputsOf(p.id).ans; const valid = cur(a,G) && typeof a.c==="number";
    const ok = valid && a.c===0;
    const ms = valid ? Math.max(0, Math.min(Q_MS, Number(a.ms)||Q_MS)) : Q_MS;
    const pts = ok ? 100 + Math.round(100*(1 - ms/Q_MS)) : 0;
    scores[p.id] = (scores[p.id]||0) + pts;
    last[p.id] = {c: valid ? a.c : -1, pts};
  });
  setPhase("reveal", {scores, last});
}
function nextRound(){
  if (G.round >= ROUNDS) setPhase("end");
  else setPhase("vote", {round:G.round+1, opts:pickOpts(G.theme), tally:{}});
}
function hostTick(){
  if (!G || !(isHost || mode==="local")) return;
  const el = Date.now()-phaseT0, online = mode==="online";
  if (G.phase==="vote" || G.phase==="q"){
    const key = G.phase==="vote" ? "vote" : "ans";
    const done = G.players.filter(p=>{ return cur(inputsOf(p.id)[key], G); }).map(p=>p.id);
    if (done.join()!==G.done.join()){ G = Object.assign({}, G, {done}); broadcast(); render(); }
    const all = done.length===G.players.length;
    if (G.phase==="vote" && (all || (online && el>VOTE_MS))) finishVote();
    else if (G.phase==="q" && (all || (online && el>Q_MS+800))) finishQ();
  } else if (G.phase==="theme" && el>THEME_MS) askQuestion();
  else if (G.phase==="reveal" && el>REVEAL_MS) setPhase("rank");
  else if (G.phase==="rank" && online && el>RANK_MS) nextRound();
}

/* ---------------- Ações do jogador ---------------- */
function vote(t){
  const g = view(); if (!g || g.phase!=="vote") return;
  if (mode==="local"){
    const p = G.players[localTurn]; if (!p) return;
    localIn[p.id] = Object.assign({}, localIn[p.id], {vote:{g:G.gid, r:G.round, t}});
    localTurn++; render(); return;
  }
  if (cur(myIn.vote,g)) return;
  myIn.vote = {g:g.gid, r:g.round, t}; room && room.presence({vote:myIn.vote}).catch(()=>{}); render();
}
function answer(c){
  const g = view(); if (!g || g.phase!=="q") return;
  if (mode==="local"){
    const p = G.players[localTurn]; if (!turnReady || !p) return;
    localIn[p.id] = Object.assign({}, localIn[p.id], {ans:{g:G.gid, r:G.round, c, ms:Date.now()-turnT0}});
    localTurn++; turnReady=false; render(); return;
  }
  if (cur(myIn.ans,g)) return;
  myIn.ans = {g:g.gid, r:g.round, c, ms:Date.now()-localT0}; room && room.presence({ans:myIn.ans}).catch(()=>{}); render();
}

    <div class="avatars" role="group" aria-label="Avatar">${AVATARS.map(([e,n])=>`<button class="av" data-lav="${e}" aria-pressed="${me._la===e}" ${taken.includes(e)?"disabled":""}><b>${e}</b>${n}</button>`).join("")}</div>
    <button class="btn ghost" data-act="ladd">Adicionar jogador</button>
  </div>`:""}
  <button class="btn" data-act="lstart" ${localPlayers.length<2?"disabled":""}>Começar o jogo</button>`;
}

function timerHTML(){ return `<div class="row" style="justify-content:space-between"><span class="kicker">Tempo</span><span class="tnum" id="tnum"></span></div><div class="timer"><i id="tbar"></i></div>`; }

function screenVote(g){
  let who = null, voted = false, myVote=null;
  if (mode==="local"){ who = g.players[localTurn]; if (!who) return `${topbar(g)}<div class="panel pass"><div class="big">Contando os votos…</div></div>`; }
  else { myVote = cur(myIn.vote,g) ? myIn.vote.t : null; voted = !!myVote; }
  const inGame = mode==="local" || g.players.some(p=>p.id===me.pid);
  return `${topbar(g)}
  <div class="stack">
    <div class="kicker">${mode==="local"?`Vez de ${esc(who.a)} ${esc(who.n)} votar`:"Vote no tema da rodada"}</div>
    ${mode==="online"?timerHTML():""}
    <div class="themes">${g.opts.map(k=>`<button class="theme" data-vote="${k}" aria-pressed="${myVote===k}" ${voted||!inGame?"disabled":""}><span class="e">${THEMES[k].e}</span>${THEMES[k].n}</button>`).join("")}</div>
    ${voted?`<p class="muted center">Voto registrado. Esperando os outros…</p>`:""}
    ${chipsHTML(g)}
  </div>`;
}

function screenTheme(g){
  const t = THEMES[g.theme];
  const counts = g.opts.map(k=>`${THEMES[k].e} ${g.tally[k]||0}`).join(" · ");
  return `${topbar(g)}
  <div class="panel reveal-theme">
    <div class="kicker">O tema escolhido foi</div>
    <div class="e">${t.e}</div>
    <div class="big">${t.n}</div>
    <p class="muted">Votos: ${counts}</p>
  </div>`;
}

function qData(g){ const [th,i]=g.qid.split("-"); return Q[th][+i]; }

function screenQuestion(g){
  const [text, alts] = qData(g);
  if (mode==="local"){
    const p = g.players[localTurn];
    if (!p) return `${topbar(g)}<div class="panel pass"><div class="big">Conferindo respostas…</div></div>`;
    if (!turnReady) return `${topbar(g)}
      <div class="panel pass"><div class="kicker">${THEMES[g.theme].e} ${THEMES[g.theme].n}</div>
      <div class="e">${esc(p.a)}</div><div class="big">Vez de ${esc(p.n)}</div>
      <p class="muted">Passe o celular para ${esc(p.n)}. Os outros não podem espiar!</p>
      <button class="btn" data-act="ready">Estou pronto</button></div>`;
  }
  const mine = mode==="online" && cur(myIn.ans,g) ? myIn.ans.c : null;
  const inGame = mode==="local" || g.players.some(p=>p.id===me.pid);
  const locked = mine!==null || !inGame;
  return `${topbar(g)}
  <div class="stack">
    <div class="kicker">${THEMES[g.theme].e} ${THEMES[g.theme].n}${mode==="local"?` · ${esc(g.players[localTurn].n)} respondendo`:""}</div>
    ${timerHTML()}
    <div class="question">${esc(text)}</div>
    <div class="opts">${g.order.map((oi,pos)=>`<button class="opt" data-ans="${oi}" aria-pressed="${mine===oi}" ${locked?"disabled":""}><span class="L">${LETTERS[pos]}</span><span>${esc(alts[oi])}</span></button>`).join("")}</div>
    ${mine!==null?`<p class="muted center">Resposta enviada. Esperando os outros…</p>`:""}
    ${mode==="online"?chipsHTML(g):""}
  </div>`;
}

function screenReveal(g){
  const [text, alts] = qData(g);
  const mineC = mode==="online" && g.last[me.pid] ? g.last[me.pid].c : null;
  return `${topbar(g)}
  <div class="stack">
    <div class="question">${esc(text)}</div>
    <div class="opts">${g.order.map((oi,pos)=>`<div class="opt ${oi===0?"right":(oi===mineC?"wrong":"")}"><span class="L">${LETTERS[pos]}</span><span>${esc(alts[oi])}</span></div>`).join("")}</div>
    <div class="panel">
      <div class="kicker">Quem acertou</div>
      ${g.players.map(p=>{ const l=g.last[p.id]||{pts:0,c:-1}; const ok=l.pts>0;
        return `<div class="res"><span>${esc(p.a)} ${esc(p.n)}</span><span class="pts ${ok?"ok":"no"}">${ok?"+"+l.pts:(l.c===-1?"sem resposta":"errou")}</span></div>`; }).join("")}
    </div>
  </div>`;
}

function rankingList(g, withGain){
  const sorted = g.players.slice().sort((a,b)=>(g.scores[b.id]||0)-(g.scores[a.id]||0));
  let lastScore=null, pos=0;
  return `<ol class="rank">${sorted.map((p,i)=>{
    const s=g.scores[p.id]||0; if (s!==lastScore){pos=i+1; lastScore=s;}
    const gain = withGain && g.last[p.id] ? g.last[p.id].pts : 0;
    return `<li class="${pos===1?"first":""}"><span class="pos">${pos}º</span><span class="e">${esc(p.a)}</span><span class="nm">${esc(p.n)}${p.id===me.pid&&mode==="online"?" (você)":""}</span><span class="sc">${s}${withGain?`<span class="gain">${gain?"+"+gain:"+0"}</span>`:""}</span></li>`; }).join("")}</ol>`;
}

function screenRank(g){
  const host = mode==="local" || isHost;
  return `${topbar(g)}
  <div class="stack">
    <div class="kicker">Ranking depois da rodada ${g.round}</div>
    ${rankingList(g,true)}
    ${host?`<button class="btn" data-act="next">${g.round>=ROUNDS?"Ver o campeão":"Próxima rodada"}</button>
      ${mode==="online"?`<p class="note center">Avança sozinho em alguns segundos.</p>`:""}`
      :`<p class="muted center">${g.round>=ROUNDS?"O campeão vem aí…":"Próxima rodada já já…"}</p>`}
  </div>`;
}

function screenEnd(g){
  const max = Math.max(...g.players.map(p=>g.scores[p.id]||0));
  const champs = g.players.filter(p=>(g.scores[p.id]||0)===max);
  const host = mode==="local" || isHost;
  return `
  <div class="panel champ">
    <div class="kicker">${champs.length>1?"Empate! Campeões da noite":"Campeão da noite"}</div>
    <div class="e">${champs.map(c=>esc(c.a)).join(" ")}</div>
    <div class="big">${champs.map(c=>esc(c.n)).join(" & ")}</div>
    <p class="muted">${max} pontos em ${ROUNDS} rodadas</p>
  </div>
  ${rankingList(g,false)}
  ${host?`<button class="btn" data-act="again">Jogar de novo</button><button class="btn ghost" data-act="tolobby">${mode==="local"?"Trocar jogadores":"Voltar para a sala"}</button>`:`<p class="muted center">O anfitrião pode começar outra partida.</p>`}`;
}

let screen = "home", lastKey = "";
function render(force){
  const g = view();
  let html, key;
  if (g && (mode==="local" || g.phase)) {
    if (g.seq!==seenSeq){ seenSeq=g.seq; localT0 = isHost||mode==="local" ? phaseT0 : Date.now(); }
    key = [g.seq, g.phase, (g.done||[]).join(), JSON.stringify(myIn), localTurn, turnReady].join("|");
    if (!force && key===lastKey) return;
    html = ({vote:screenVote, theme:screenTheme, q:screenQuestion, reveal:screenReveal, rank:screenRank, end:screenEnd})[g.phase](g);
  } else {
    if (screen==="lobby" && !force && $("#lobbyList")) { // atualização leve do saguão
      const k = "lobby|"+JSON.stringify(lobbyPlayers())+"|"+isHost+"|"+!!hostPeer();
      if (k===lastKey) return; lastKey=k; $("#app").innerHTML = screenLobby(); tickTimer(); return;
    }
    if (screen==="profile" && !force && $("#nm")) return; // não atrapalha a digitação
    if (screen==="lsetup" && !force && $("#nm")) return;
    key = screen+"|"+roomOK;
    if (!force && key===lastKey) return;
    html = ({home:screenHome, profile:screenProfile, lobby:screenLobby, lsetup:screenLocalSetup})[screen]();
    if (screen==="lobby") key = "lobby|"+JSON.stringify(lobbyPlayers())+"|"+isHost+"|"+!!hostPeer();
  }
  lastKey = key;
  $("#app").innerHTML = html;
  tickTimer();
}

function tickTimer(){
  const bar = $("#tbar"), num = $("#tnum"); if (!bar) return;
  const g = view(); if (!g) return;
  let total = g.phase==="vote" ? VOTE_MS : Q_MS;
  let start = mode==="local" ? turnT0 : localT0;
  const left = Math.max(0, total - (Date.now()-start));
  bar.style.transform = `scaleX(${left/total})`;
  num.textContent = Math.ceil(left/1000)+"s";
  if (mode==="local" && g.phase==="q" && turnReady && left<=0) answer(-1);
}
setInterval(tickTimer, 250);

/* ---------------- Eventos ---------------- */
document.addEventListener("input", e=>{
  if (e.target.id==="nm" && screen==="profile"){ me.n = e.target.value.trim(); store.set("qz_name", me.n);
    const b = document.querySelector('[data-act="join"]'); if (b) b.disabled = !(me.n && me.a); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.av){ me.a = t.dataset.av; store.set("qz_av", me.a);
    document.querySelectorAll("[data-av]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.av===me.a));
    const b = document.querySelector('[data-act="join"]'); if (b) b.disabled = !(me.n && me.a); return; }
  if (t.dataset.lav){ me._la = t.dataset.lav; document.querySelectorAll("[data-lav]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lav===me._la)); return; }
  if (t.dataset.rm){ localPlayers.splice(+t.dataset.rm,1); render(true); return; }
  if (t.dataset.vote){ vote(t.dataset.vote); return; }
  if (t.dataset.ans){ answer(+t.dataset.ans); return; }
  const a = t.dataset.act;
  if (a==="online"){ mode="online"; screen="profile"; render(true); }
  else if (a==="local"){ mode="local"; screen="lsetup"; render(true); }
  else if (a==="home"){ mode=null; screen="home"; if (me.joined && room){ room.presence({me:null, host:null, g:null}).catch(()=>{}); me.joined=false; isHost=false; } render(true); }
  else if (a==="join"){ if(!me.n||!me.a) return; me.joined=true; screen="lobby"; room && room.presence({me:{pid:me.pid,n:me.n,a:me.a}}).catch(()=>{}); render(true); }
  else if (a==="edit"){ screen="profile"; render(true); }
  else if (a==="becomehost"){ if (hostPeer()) return render(true); isHost=true; room && room.presence({host:true, g:null}).catch(()=>{}); render(true); }
  else if (a==="start"){ const ps = lobbyPlayers(); if (ps.length<2) return; startGame(ps); }
  else if (a==="ladd"){ const n = ($("#nm").value||"").trim().slice(0,16); if (!n || !me._la) return;
    localPlayers.push({id:"p"+localPlayers.length+Date.now()%1000, n, a:me._la}); me._la=""; render(true); }
  else if (a==="lstart"){ if (localPlayers.length<2) return; startGame(localPlayers.slice()); }
  else if (a==="ready"){ turnReady=true; turnT0=Date.now(); render(true); }
  else if (a==="next"){ if (G && G.phase==="rank") nextRound(); }
  else if (a==="again"){ startGame(mode==="local" ? G.players : lobbyPlayers()); }
  else if (a==="tolobby"){ G=null; myIn={vote:null,ans:null}; if (mode==="online"){ room && room.presence({g:null}).catch(()=>{}); screen="lobby"; } else screen="lsetup"; render(true); }
});

let wakeLock=null;
async function wake(){ try{ if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null); } }catch(e){} }
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && G) wake(); });

/* ---------------- Sala online ---------------- */
render(true);
(async ()=>{
  try {
    room = window.claude && window.claude.use ? await window.claude.use("room") : null;
  } catch(e){ room = null; }
  roomOK = !!room;
  if (room){
    room.onPeers(()=>{
      // o anfitrião sumiu no meio do jogo?
      const g = view();
      if (g && g.gid && g.gid!==lastGid){ lastGid=g.gid; if (!isHost){ myIn={vote:null,ans:null}; room.presence({vote:null, ans:null}).catch(()=>{}); } }
      render();
    }, ()=>{ roomOK=false; render(true); });
  }
  if (screen==="home") render(true);
})();
</script>
</body>
</html>
