<style>
:root{
  --bg:#f5f2fc;--ink:#1d1633;--muted:#6a6188;--card:#ffffff;--line:#e4def5;
  --pink:#d6246a;--violet:#6d2aa8;--gold:#f2b705;
  --shadow:0 10px 30px rgba(60,20,110,.12);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#150f26;--ink:#f3eefc;--muted:#a79ec4;--card:#201736;--line:#34294f;--shadow:0 10px 30px rgba(0,0,0,.45)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{padding:44px 0 26px;text-align:center}
.logo{display:inline-flex;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--violet));align-items:center;justify-content:center;box-shadow:var(--shadow);margin-bottom:16px}
.logo svg{width:34px;height:34px;fill:#fff}
h1{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:17px}
.list{display:grid;gap:14px}
.game{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.game:active{transform:scale(.985)}
@media (hover:hover){.game:hover{transform:translateY(-2px)}}
.game:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.game img{width:76px;height:76px;border-radius:20px;flex:none;display:block}
.game h2{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-size:22px;line-height:1.15;margin:0 0 4px}
.game p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--pink) 12%,transparent);color:var(--pink)}
.go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center}
.go svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.soon{display:flex;gap:16px;align-items:center;border:2px dashed var(--line);border-radius:22px;padding:16px;color:var(--muted)}
.soon .ph{width:76px;height:76px;border-radius:20px;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.soon b{display:block;color:var(--ink);font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;font-size:19px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 6h9a5.5 5.5 0 0 1 5.4 6.5l-.7 4a3 3 0 0 1-5 1.7L14 16.5h-4l-1.2 1.7a3 3 0 0 1-5-1.7l-.7-4A5.5 5.5 0 0 1 7.5 6Zm.2 3v1.6H6.1v1.8h1.6V14h1.8v-1.6h1.6v-1.8H9.5V9H7.7Zm8.3 1.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Zm2.4 2.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/></svg></div>
    <h1>Jogos</h1>
    <p>Para jogar em grupo, direto no celular.</p>
  </header>

  <main class="list">
    <a class="game" href="quem-e-mais/">
      <img src="quem-e-mais/icon-192.png" width="76" height="76" alt="">
      <div>
        <h2>Quem é mais?</h2>
        <p>O jogo dos casais. Apontem ao mesmo tempo: combinou, ponto; divergiu, prenda!</p>
        <div class="tags"><span class="tag">2 a 6 casais</span><span class="tag">+130 perguntas</span><span class="tag">60 prendas</span></div>
      </div>
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>

    <div class="soon">
      <div class="ph" aria-hidden="true">🎲</div>
      <div><b>Novos jogos em breve</b>Tem mais coisa chegando por aqui.</div>
    </div>
  </main>

  <footer>Sem cadastro e sem anúncios. · <a href="privacidade/" style="color:inherit">Privacidade</a></footer>
</div>
</body>
</html>
